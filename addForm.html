<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>새 감상평 등록 - 시네마 로그</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-color: #6c5ce7;
            --border-color: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Pretendard', sans-serif; background-color: var(--bg-color); color: var(--text-main); padding-bottom: 50px; }

        .navbar { background-color: var(--card-bg); display: flex; align-items: center; justify-content: space-between; padding: 15px 40px; border-bottom: 1px solid var(--border-color); }
        .nav-left { display: flex; align-items: center; gap: 30px; }
        .navbar-brand { font-size: 20px; font-weight: bold; color: var(--text-main); text-decoration: none; }
        .nav-menu { list-style: none; display: flex; gap: 20px; align-items: center; }
        .nav-menu a { color: var(--text-sub); text-decoration: none; font-weight: bold; transition: 0.2s; }
        .nav-menu a:hover, .nav-menu a.active { color: var(--accent-color); }

        .container { max-width: 550px; margin: 50px auto; background: var(--card-bg); padding: 35px; border-radius: 12px; border: 1px solid var(--border-color); }
        h2 { color: var(--text-main); margin-bottom: 20px; border-bottom: 2px solid var(--accent-color); padding-bottom: 10px; }

        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: var(--text-sub); }
        input[type="text"], select, textarea { width: 100%; padding: 12px; background: #0f172a; border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); outline: none; }
        input[type="text"]:focus, select:focus, textarea:focus { border-color: var(--accent-color); }
        textarea { height: 140px; resize: vertical; }

        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        .btn { padding: 12px; color: white; border-radius: 8px; border: none; cursor: pointer; text-decoration: none; text-align: center; font-weight: bold; flex: 1; }
        .btn-save { background-color: var(--accent-color); }
        .btn-cancel { background-color: #475569; }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="nav-left">
        <a href="index.html" class="navbar-brand">🎬 시네마 로그</a>
        <ul class="nav-menu">
            <li><a href="index.html">메인</a></li>
            <li><a href="about.html">사이트 소개</a></li>
            <li><a href="addForm.html" class="active">+ 감상평 등록</a></li>
        </ul>
    </div>
</nav>

<div class="container">
    <h2>🎬 새 감상평 등록</h2>
    <form id="addForm">
        <div class="form-group">
            <label>영화 제목</label>
            <input type="text" id="title" required placeholder="영화 제목을 입력하세요">
        </div>
        <div class="form-group">
            <label>장르 선택</label>
            <select id="genre">
                <option value="액션">액션</option>
                <option value="드라마">드라마</option>
                <option value="코미디">코미디</option>
                <option value="SF/판타지">SF/판타지</option>
                <option value="스릴러/공포">스릴러/공포</option>
                <option value="기타" selected>기타</option>
            </select>
        </div>
        <div class="form-group">
            <label>작성자</label>
            <input type="text" id="writer" required placeholder="작성자 이름">
        </div>
        <div class="form-group">
            <label>감상평</label>
            <textarea id="content" required placeholder="영화 후기 및 감상을 남겨주세요."></textarea>
        </div>
        <div class="btn-group">
            <button type="submit" class="btn btn-save">저장하기</button>
            <a href="index.html" class="btn btn-cancel">취소</a>
        </div>
    </form>
</div>

<script>
    document.getElementById('addForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const titleVal = document.getElementById('title').value;
        const genreVal = document.getElementById('genre').value;
        const writerVal = document.getElementById('writer').value;
        const contentVal = document.getElementById('content').value;

        const newMovie = {
    title: titleVal,
    genre: genreVal,
    writer: writerVal,
    content: contentVal,
    createdAt: new Date().toISOString()
};
        try {
            const response = await fetch('/api/movies', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newMovie)
            });

            if (response.ok) {
                alert('DB에 성공적으로 저장되었습니다!');
                window.location.href = 'index.html';
            } else {
                alert('저장 실패: 서버 응답 오류');
            }
        } catch (error) {
            console.error('오류 발생:', error);
            alert('서버와 통신할 수 없습니다. node server.js가 실행 중인지 확인하세요.');
        }
    });
</script>
</body>
</html>
