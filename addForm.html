<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>새 감상평 등록 - 시네마 감상평 게시판</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #f4f6f9; margin: 40px 0; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { color: #3b3b98; margin-top: 0; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; color: #333; }
        input[type="text"], textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; outline: none; }
        textarea { height: 140px; resize: vertical; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        .btn { padding: 10px 18px; color: white; border-radius: 6px; border: none; cursor: pointer; text-decoration: none; display: inline-block; font-size: 14px; text-align:center; }
        .btn-save { background-color: #3b3b98; }
        .btn-cancel { background-color: #7f8c8d; }
    </style>
</head>
<body>
<div class="container">
    <h2>🎬 새 감상평 등록</h2>
    <form id="addForm">
        <div class="form-group">
            <label>영화 제목</label>
            <input type="text" id="title" required placeholder="예: 영화 제목을 입력하세요!">
        </div>
        <div class="form-group">
            <label>추천자 / 작성자</label>
            <input type="text" id="writer" required placeholder="작성자 이름">
        </div>
        <div class="form-group">
            <label>장르 및 후기</label>
            <textarea id="content" required placeholder="[장르] 슈퍼히어로, 액션&#10;&#10;[감상평] 자유롭게 작성하세요."></textarea>
        </div>
        <div class="btn-group">
            <button type="submit" class="btn btn-save">저장하기</button>
            <a href="list.html" class="btn btn-cancel">취소</a>
        </div>
    </form>
</div>

<script>
    document.getElementById('addForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const movies = JSON.parse(localStorage.getItem('movies')) || [];
        
        const newMovie = {
            id: Date.now(), // 고유 ID 생성
            title: document.getElementById('title').value,
            writer: document.getElementById('writer').value,
            content: document.getElementById('content').value,
            views: 0
        };

        movies.unshift(newMovie); // 최신글이 맨 위로
        localStorage.setItem('movies', JSON.stringify(movies));

        alert('저장되었습니다!');
        window.location.href = 'list.html';
    });
</script>
</body>
</html>
