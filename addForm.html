<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>시네마 로그 - 감상평 작성</title>

<style>
:root{
    --bg-color:#0f172a;
    --card-bg:#1e293b;
    --text-main:#f8fafc;
    --text-sub:#94a3b8;
    --accent-color:#6c5ce7;
    --border-color:#334155;
}
*{margin:0;padding:0;box-sizing:border-box;}

body{
    background:var(--bg-color);
    color:var(--text-main);
    font-family:Pretendard,sans-serif;
    padding:40px 20px;
}

.form-container{
    max-width:600px;
    margin:auto;
    background:var(--card-bg);
    border:1px solid var(--border-color);
    border-radius:12px;
    padding:30px;
}

h2{
    text-align:center;
    margin-bottom:20px;
}

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:8px;
    color:var(--text-sub);
    font-weight:bold;
}

input,select,textarea{
    width:100%;
    padding:12px;
    background:#0f172a;
    border:1px solid var(--border-color);
    border-radius:6px;
    color:white;
}

textarea{
    resize:none;
    height:130px;
}

.btn-submit{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    background:var(--accent-color);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.btn-submit:hover{
    background:#5b4bc4;
}

.btn-submit:disabled{
    background:#475569;
    cursor:not-allowed;
}
</style>

</head>
<body>

<div class="form-container">

<h2 id="pageTitle">✍️ 새 영화 감상평 작성</h2>

<form id="reviewForm">

<div class="form-group">
<label>영화 제목</label>
<input type="text" id="title" maxlength="50" required>
</div>

<div class="form-group">
<label>작성자</label>
<input type="text" id="writer" maxlength="15" required>
</div>

<div class="form-group">
<label>장르</label>

<select id="genre">

<option>액션</option>
<option>드라마</option>
<option>코미디</option>
<option>SF/판타지</option>
<option>스릴러/공포</option>
<option selected>기타</option>

</select>


</div>

<div class="form-group">
<label>감상평</label>

<textarea id="content" required></textarea>

</div>

<button id="submitBtn" class="btn-submit">
감상평 등록
</button>

</form>

</div>

<script>


const COOL_TIME_MS = 10 * 60 * 60 * 1000;

const params = new URLSearchParams(location.search);
const editId = params.get("id");
const movieTitle = params.get("title");


document
.getElementById("reviewForm")
.addEventListener("submit",submitReview);

async function submitReview(e){

e.preventDefault();

const submitBtn=document.getElementById("submitBtn");

submitBtn.disabled=true;
submitBtn.innerText=editId?"수정 중...":"등록 중...";

const title=document.getElementById("title").value.trim();
const writer=document.getElementById("writer").value.trim();
const genre=document.getElementById("genre").value;
const content=document.getElementById("content").value.trim();

if(!editId){

const lastSubmitTime=localStorage.getItem("lastReviewTime");

if(lastSubmitTime){

const now=Date.now();

const diff=now-parseInt(lastSubmitTime);

if(diff<COOL_TIME_MS){

alert("10시간에 한 번만 등록 가능합니다.");

submitBtn.disabled=false;
submitBtn.innerText="감상평 등록";

return;

}

}

}

try{
const title = document.getElementById("title").value.trim();
const writer = document.getElementById("writer").value.trim();
const genre = document.getElementById("genre").value;
const content = document.getElementById("content").value.trim();
const url=editId
?`/api/movies/${editId}`
:"/api/movies";

const method=editId
?"PUT"
:"POST";

const res = await fetch(url, {

    method,

    headers: {
        "Content-Type": "application/json"
    },

    body: JSON.stringify({
        title,
        writer,
        genre,
        content

})

});

if(res.ok){

if(!editId){

localStorage.setItem(
"lastReviewTime",
Date.now().toString()
);

}

alert(editId?"감상평이 수정되었습니다.":"감상평이 등록되었습니다.");

location.href="index.html";

}

else{

alert(editId?"수정 실패":"등록 실패");

submitBtn.disabled=false;
submitBtn.innerText=editId?"수정하기":"감상평 등록";

}

}catch(err){

console.error(err);

alert("서버 오류");

submitBtn.disabled=false;
submitBtn.innerText=editId?"수정하기":"감상평 등록";

}

}

window.onload = async () => {

  
    if (editId) {

        document.querySelector("h2").innerText = "✏ 영화 감상평 수정";
        document.getElementById("submitBtn").innerText = "수정하기";

        try {

            const res = await fetch(`/api/movies/${editId}`);

            if (!res.ok) return;

            const movie = await res.json();

            document.getElementById("title").value = movie.title;
            document.getElementById("writer").value = movie.writer;
            document.getElementById("genre").value = movie.genre;
            document.getElementById("content").value = movie.content;

        } catch(err) {

            console.log(err);

        }

        return;
    }


    if (movieTitle) {

        document.getElementById("title").value = movieTitle;

        document.getElementById("title").readOnly = true;

    }

};
</script>

</body>
</html>
