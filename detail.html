<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>영화 감상 상세 - 시네마 로그</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #f4f6f9; margin: 0; padding-bottom: 40px; }
        .navbar { background-color: #3b3b98; display: flex; align-items: center; padding: 0 40px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .nav-left { display: flex; align-items: center; gap: 30px; }
        .navbar-brand { font-size: 20px; font-weight: bold; color: white; text-decoration: none; padding: 15px 0; }
        .nav-menu { list-style: none; display: flex; gap: 20px; margin: 0; padding: 0; align-items: center; }
        .nav-menu a { color: #dcdde1; text-decoration: none; font-size: 15px; font-weight: bold; transition: 0.2s; }
        .nav-menu a:hover { color: #ffffff; text-decoration: underline; }
        .container { max-width: 650px; margin: 40px auto; background: white; padding: 35px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { color: #3b3b98; margin-top: 0; border-bottom: 2px solid #3b3b98; padding-bottom: 10px; }
        .info { background: #f8f9fa; padding: 15px 20px; border-radius: 8px; margin: 20px 0; line-height: 1.8; }
        .content-box { white-space: pre-wrap; line-height: 1.7; border: 1px solid #e9ecef; padding: 20px; border-radius: 8px; background: #fff; min-height: 100px; }
        .btn-group { margin-top: 25px; display: flex; gap: 10px; }
        .btn { padding: 9px 18px; color: white; text-decoration: none; border-radius: 6px; border: none; cursor: pointer; font-size: 14px; display: inline-block; }
        .btn-list { background-color: #7f8c8d; }
        .btn-edit { background-color: #3b3b98; }
        .btn-delete { background-color: #e74c3c; }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="nav-left">
        <a href="index.html" class="navbar-brand">🎬 시네마 로그</a>
        <ul class="nav-menu">
            <li><a href="index.html">메인</a></li>
            <li><a href="about.html">사이트 소개</a></li>
            <li><a href="addForm.html">+ 감상평 등록</a></li>
        </ul>
    </div>
</nav>
<div class="container">
    <h2 id="movieTitle"></h2>
    <div class="info">
        <div><strong>작성자:</strong> <span id="movieWriter"></span></div>
        <div><strong>조회수:</strong> <span id="movieViews"></span></div>
    </div>
    <h3 style="font-size: 16px; color: #333;">장르 및 감상평</h3>
    <div class="content-box" id="movieContent"></div>
    <div class="btn-group">
        <a href="index.html" class="btn btn-list">목록으로</a>
        <a id="editBtn" class="btn btn-edit">수정</a>
        <button type="button" class="btn btn-delete" onclick="deleteMovie()">삭제</button>
    </div>
</div>
<script>
    const urlParams = new URLSearchParams(window.location.search);
    const movieId = urlParams.get('id');

    async function loadDetail() {
        if (!movieId) return;
        try {
            const response = await fetch(`/api/movies/${movieId}`);
            if (response.ok) {
                const movie = await response.json();
                document.getElementById('movieTitle').innerText = movie.title;
                document.getElementById('movieWriter').innerText = movie.writer;
                document.getElementById('movieViews').innerText = movie.views;
                document.getElementById('movieContent').innerText = movie.content;
                document.getElementById('editBtn').href = `editForm.html?id=${movie.id}`;
            }
        } catch (error) {
            console.error('상세 정보 로드 실패:', error);
        }
    }

    async function deleteMovie() {
        if (confirm("정말로 이 감상평을 삭제하시겠습니까?")) {
            try {
                const response = await fetch(`/api/movies/${movieId}`, { method: 'DELETE' });
                if (response.ok) {
                    alert("삭제되었습니다.");
                    window.location.href = "index.html";
                }
            } catch (error) {
                console.error('삭제 오류:', error);
            }
        }
    }
    window.onload = loadDetail;
</script>
</body>
</html>
