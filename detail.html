<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시네마 로그 - 영화 상세 정보</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-color: #6c5ce7;
            --accent-hover: #5b4bc4;
            --border-color: #334155;
            --warning-color: #f1c40f;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Pretendard', sans-serif; background-color: var(--bg-color); color: var(--text-main); padding-bottom: 50px; }

        .navbar { background-color: var(--card-bg); display: flex; align-items: center; justify-content: space-between; padding: 15px 40px; border-bottom: 1px solid var(--border-color); }
        .nav-left { display: flex; align-items: center; gap: 30px; }
        .navbar-brand { font-size: 20px; font-weight: bold; color: var(--text-main); text-decoration: none; }
        .nav-menu { list-style: none; display: flex; gap: 20px; align-items: center; }
        .nav-menu a { color: var(--text-sub); text-decoration: none; font-weight: bold; transition: 0.2s; }
        .nav-menu a:hover, .nav-menu a.active { color: var(--accent-color); }

        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        
        .movie-detail-container { 
            background-color: var(--card-bg); 
            border: 1px solid var(--border-color); 
            border-radius: 16px; 
            padding: 30px; 
            display: flex;
            gap: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        .poster-box { flex-shrink: 0; width: 280px; }
        .poster-box img { width: 100%; border-radius: 12px; border: 1px solid var(--border-color); object-fit: cover; }

        .info-box { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .movie-header { margin-bottom: 15px; }
        .movie-title { font-size: 28px; font-weight: bold; color: var(--text-main); margin-bottom: 8px; }
        .movie-tagline { font-size: 15px; color: var(--accent-color); font-style: italic; margin-bottom: 12px; }

        .meta-list { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; font-size: 14px; }
        .meta-badge { background: #0f172a; border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 8px; color: var(--text-sub); }
        .vote-badge { background: rgba(241, 196, 15, 0.1); border: 1px solid var(--warning-color); color: var(--warning-color); font-weight: bold; }

        .overview-box { background: #0f172a; border: 1px solid var(--border-color); padding: 20px; border-radius: 10px; margin-bottom: 20px; flex: 1; }
        .overview-title { font-size: 16px; font-weight: bold; margin-bottom: 10px; color: var(--text-main); }
        .overview-text { font-size: 14px; line-height: 1.7; color: var(--text-sub); white-space: pre-line; word-break: keep-all; }

        .action-btns { display: flex; gap: 12px; }
        .btn { padding: 12px 24px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; font-size: 14px; text-decoration: none; display: inline-block; transition: 0.2s; text-align: center; }
        .btn-primary { background-color: var(--accent-color); color: white; }
        .btn-primary:hover { background-color: var(--accent-hover); }
        .btn-secondary { background-color: #334155; color: white; }
        .btn-secondary:hover { background-color: #475569; }

        @media (max-width: 768px) {
            .movie-detail-container { flex-direction: column; }
            .poster-box { width: 100%; text-align: center; }
            .poster-box img { max-width: 250px; }
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="nav-left">
        <a href="index.html" class="navbar-brand">🎬 시네마 로그</a>
        <ul class="nav-menu">
            <li><a href="index.html">메인</a></li>
            <li><a href="about.html">사이트 소개</a></li>
            <li><a href="#" class="active">영화 상세 정보</a></li>
            <li><a href="addForm.html">+ 감상평 등록</a></li>
        </ul>
    </div>
</nav>

<div class="container">
    <div class="movie-detail-container" id="detailContent">
        <div style="text-align:center; width:100%; padding:50px; color:var(--text-sub);">
            ⚡ 영화 정보를 불러오는 중입니다...
        </div>
    </div>
</div>

<script>
    const TMDB_API_KEY = 'f97987814400762f02f8373b5a1b32d2';

    // URL 파라미터 가져오기 (movieId 또는 title)
    const urlParams = new URLSearchParams(window.location.search);
    const apiMovieId = urlParams.get('movieId');
    const movieTitle = urlParams.get('title');

    async function fetchMovieDetails() {
        const container = document.getElementById('detailContent');

        try {
            let movie = null;

            // 1. API ID가 직접 넘어온 경우
            if (apiMovieId) {
                const res = await fetch(`https://api.themoviedb.org/3/movie/${apiMovieId}?api_key=${TMDB_API_KEY}&language=ko-KR`);
                if (res.ok) movie = await res.json();
            } 
            // 2. 영화 제목으로 검색해서 넘어온 경우
            else if (movieTitle) {
                const res = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&language=ko-KR&query=${encodeURIComponent(movieTitle)}`);
                const data = await res.json();
                if (data.results && data.results.length > 0) {
                    movie = data.results[0]; // 가장 연관성 높은 첫 번째 결과 선택
                }
            }

            // 데이터가 있는 경우 화면 렌더링
            if (movie) {
                renderMovieDetail(movie);
            } else {
                renderNotFound();
            }

        } catch (err) {
            console.error('영화 상세 로드 실패:', err);
            renderNotFound();
        }
    }

    function renderMovieDetail(m) {
        const posterUrl = m.poster_path 
            ? `https://image.tmdb.org/t/p/w500${m.poster_path}` 
            : 'https://via.placeholder.com/280x400/1e293b/f8fafc?text=No+Poster';

        const genres = m.genres ? m.genres.map(g => g.name).join(', ') : '정보 없음';
        const releaseDate = m.release_date || '정보 없음';
        const voteAvg = m.vote_average ? m.vote_average.toFixed(1) : '0.0';
        const overview = m.overview ? m.overview : '등록된 상세 줄거리 정보가 없습니다.';

        document.getElementById('detailContent').innerHTML = `
            <div class="poster-box">
                <img src="${posterUrl}" alt="${m.title}" onerror="this.src='https://via.placeholder.com/280x400/1e293b/f8fafc?text=No+Poster'">
            </div>
            <div class="info-box">
                <div>
                    <div class="movie-header">
                        <h1 class="movie-title">${m.title}</h1>
                        ${m.tagline ? `<div class="movie-tagline">"${m.tagline}"</div>` : ''}
                    </div>

                    <div class="meta-list">
                        <span class="meta-badge vote-badge">★ 평점 ${voteAvg}</span>
                        <span class="meta-badge">📅 개봉일: ${releaseDate}</span>
                        <span class="meta-badge">🎬 장르: ${genres}</span>
                    </div>

                    <div class="overview-box">
                        <div class="overview-title">📖 줄거리</div>
                        <div class="overview-text">${overview}</div>
                    </div>
                </div>

                <div class="action-btns">
                    <a href="index.html" class="btn btn-secondary">&larr; 목록으로</a>
                    <a href="addForm.html?title=${encodeURIComponent(m.title)}" class="btn btn-primary">✍️ 이 영화 감상평 남기기</a>
                </div>
            </div>
        `;
    }

    function renderNotFound() {
        document.getElementById('detailContent').innerHTML = `
            <div style="text-align:center; width:100%; padding:50px; color:var(--text-sub);">
                <h2 style="color:var(--text-main); margin-bottom:10px;">🔍 영화 정보를 찾을 수 없습니다.</h2>
                <p style="margin-bottom:20px;">요청하신 영화 정보가 존재하지 않거나 불러오지 못했습니다.</p>
                <a href="index.html" class="btn btn-primary">메인으로 돌아가기</a>
            </div>
        `;
    }

    window.onload = fetchMovieDetails;
</script>
</body>
</html>
