<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상세보기 - 시네마 로그</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-color: #6c5ce7;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
            --border-color: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Pretendard', sans-serif; background-color: var(--bg-color); color: var(--text-main); padding-bottom: 50px; }

        .navbar { background-color: var(--card-bg); display: flex; align-items: center; justify-content: space-between; padding: 15px 40px; border-bottom: 1px solid var(--border-color); }
        .nav-left { display: flex; align-items: center; gap: 30px; }
        .navbar-brand { font-size: 20px; font-weight: bold; color: var(--text-main); text-decoration: none; }
        .nav-menu { list-style: none; display: flex; gap: 20px; align-items: center; }
        .nav-menu a { color: var(--text-sub); text-decoration: none; font-weight: bold; transition: 0.2s; }
        .nav-menu a:hover, .nav-menu a.active { color: var(--accent-color); }

        .container { max-width: 650px; margin: 50px auto; background: var(--card-bg); padding: 35px; border-radius: 12px; border: 1px solid var(--border-color); }
        .title-area { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--accent-color); padding-bottom: 10px; margin-bottom: 15px; }
        h2 { color: var(--text-main); }
        .genre-tag { background: var(--accent-color); color: white; padding: 4px 10px; border-radius: 12px; font-size: 13px; font-weight: bold; }
        
        .info { background: #0f172a; padding: 15px; border-radius: 8px; margin-bottom: 20px; color: var(--text-sub); display: flex; gap: 20px; border: 1px solid var(--border-color); font-size: 14px; }
        .content-box { background: #0f172a; padding: 20px; border-radius: 8px; border: 1px solid var(--border-color); line-height: 1.7; min-height: 120px; white-space: pre-wrap; margin-bottom: 20px; }

        .like-section { text-align: center; margin-bottom: 25px; }
        .btn-like { padding: 10px 24px; background-color: #0f172a; color: #f1c40f; border: 1px solid #f1c40f; border-radius: 20px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.2s; }
        .btn-like:hover { background-color: #f1c40f; color: #0f172a; }

        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn { padding: 10px 18px; color: white; text-decoration: none; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; font-size: 14px; }
        .btn-list { background-color: #475569; }
        .btn-edit { background-color: var(--accent-color); }
        .btn-hide { background-color: var(--warning-color); }
        .btn-delete { background-color: var(--danger-color); }
        
        .admin-only { display: none; }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="nav-left">
        <a href="index.html" class="navbar-brand">🎬 시네마 로그</a>
        <ul class="nav-menu">
            <li><a href="index.html">메인</a></li>
            <li><a href="about.html">사이트 소개</a></li>
            <li><a href="#" class="active">상세 페이지</a></li>
            <li><a href="addForm.html">+ 감상평 등록</a></li>
        </ul>
    </div>
</nav>

<div class="container">
    <div class="title-area">
        <h2 id="movieTitle"></h2>
        <span class="genre-tag" id="movieGenre"></span>
    </div>
    
    <div class="info">
        <div>✍️ 작성자: <span id="movieWriter" style="color:var(--text-main);"></span></div>
        <div>👁️ 조회수: <span id="movieViews" style="color:var(--text-main);"></span></div>
        <div>👍 추천수: <span id="movieLikes" style="color:var(--text-main);"></span></div>
    </div>
    
    <div class="content-box" id="movieContent"></div>

    <div class="like-section">
        <button type="button" class="btn-like" onclick="likeMovie()">👍 이 감상평 추천하기</button>
    </div>

    <div class="btn-group">
        <a href="index.html" class="btn btn-list">목록으로</a>
        <a id="editBtn" class="btn btn-edit">수정</a>
        
        <button type="button" id="hideBtn" class="btn btn-hide admin-only" onclick="toggleHide()"></button>
        <button type="button" class="btn btn-delete admin-only" onclick="deleteMovie()">삭제 (관리자)</button>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const movieId = urlParams.get('id');
    let currentIsHidden = 0;

    function checkAdmin() {
        return localStorage.getItem('isAdmin') === 'true';
    }

    async function loadDetail() {
        if (!movieId) return;
        try {
            const response = await fetch(`/api/movies/${movieId}`);
            if (response.ok) {
                const movie = await response.json();
                document.getElementById('movieTitle').innerText = movie.title;
                document.getElementById('movieGenre').innerText = movie.genre || '기타';
                document.getElementById('movieWriter').innerText = movie.writer;
                document.getElementById('movieViews').innerText = movie.views;
                document.getElementById('movieLikes').innerText = movie.likes || 0;
                document.getElementById('movieContent').innerText = movie.content;
                document.getElementById('editBtn').href = `editForm.html?id=${movie.id}`;
                
                currentIsHidden = movie.isHidden;
                const hideBtn = document.getElementById('hideBtn');
                hideBtn.innerText = currentIsHidden ? "숨김 해제 (관리자)" : "게시글 숨기기 (관리자)";

                if (checkAdmin()) {
                    document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'inline-block');
                }
            }
        } catch (error) {
            console.error('로드 실패:', error);
        }
    }

    async function likeMovie() {
        try {
            const response = await fetch(`/api/movies/${movieId}/like`, { method: 'POST' });
            if (response.ok) {
                const data = await response.json();
                document.getElementById('movieLikes').innerText = data.likes;
                alert('추천되었습니다!');
            }
        } catch (error) {
            console.error('추천 실패:', error);
        }
    }

    async function toggleHide() {
        if (!checkAdmin()) return alert('관리자 권한이 필요합니다.');
        const targetState = currentIsHidden ? 0 : 1;
        try {
            const response = await fetch(`/api/movies/${movieId}/hide`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ isHidden: targetState })
            });
            if (response.ok) {
                alert(targetState ? '게시글이 숨김 처리되었습니다.' : '게시글 숨김이 해제되었습니다.');
                location.reload();
            }
        } catch (error) {
            console.error('숨김 처리 실패:', error);
        }
    }

    async function deleteMovie() {
        if (!checkAdmin()) return alert('관리자 권한이 필요합니다.');
        if (confirm("정말로 이 기록을 삭제하시겠습니까?")) {
            const response = await fetch(`/api/movies/${movieId}`, { method: 'DELETE' });
            if (response.ok) {
                alert("삭제되었습니다.");
                window.location.href = "index.html";
            }
        }
    }

    window.onload = loadDetail;
</script>
</body>
</html>
