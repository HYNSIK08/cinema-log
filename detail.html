<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시네마 로그 - 상세 페이지</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-color: #6c5ce7;
            --accent-hover: #5b4bc4;
            --border-color: #334155;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
            --star-color: #f1c40f;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            -webkit-user-select: none; 
            -moz-user-select: none; 
            -ms-user-select: none; 
            user-select: none; 
        }

        body { font-family: 'Pretendard', sans-serif; background-color: var(--bg-color); color: var(--text-main); padding-bottom: 50px; line-height: 1.6; }

        .navbar { background-color: var(--card-bg); display: flex; align-items: center; justify-content: space-between; padding: 15px 40px; border-bottom: 1px solid var(--border-color); }
        .nav-left { display: flex; align-items: center; gap: 30px; }
        .navbar-brand { font-size: 20px; font-weight: bold; color: var(--text-main); text-decoration: none; }
        .nav-menu { list-style: none; display: flex; gap: 20px; align-items: center; }
        .nav-menu a { color: var(--text-sub); text-decoration: none; font-weight: bold; transition: 0.2s; }
        .nav-menu a:hover, .nav-menu a.active { color: var(--accent-color); }

        .admin-btn { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border-color); background: #0f172a; color: var(--text-sub); cursor: pointer; font-size: 13px; font-weight: bold; }
        .admin-btn.active { background: var(--accent-color); color: white; border-color: var(--accent-color); }

        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }

        .detail-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 30px; margin-top: 20px; }
        .detail-header { border-bottom: 1px solid var(--border-color); padding-bottom: 20px; margin-bottom: 20px; }
        .detail-title-row { display: flex; justify-content: space-between; align-items: center; gap: 15px; flex-wrap: wrap; margin-bottom: 10px; }
        .detail-title { font-size: 26px; font-weight: bold; color: var(--text-main); }
        .detail-meta { display: flex; gap: 15px; color: var(--text-sub); font-size: 14px; flex-wrap: wrap; }
        
        .movie-detail-body { display: flex; gap: 25px; margin-bottom: 30px; flex-wrap: wrap; }
        .poster-img { width: 220px; height: 320px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border-color); }
        .detail-content { flex: 1; font-size: 16px; color: #e2e8f0; white-space: pre-wrap; line-height: 1.8; min-height: 150px; word-break: break-word; }
        
        .action-bar { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color); padding-top: 20px; flex-wrap: wrap; gap: 10px; }
        .btn-group { display: flex; gap: 10px; }

        .btn { padding: 10px 18px; border-radius: 8px; border: none; font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.2s; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
        .btn-primary { background: var(--accent-color); color: white; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-secondary { background: #334155; color: var(--text-main); }
        .btn-secondary:hover { background: #475569; }
        .btn-star { background: #0f172a; border: 1px solid var(--star-color); color: var(--star-color); }
        .btn-star.active { background: var(--star-color); color: #0f172a; }

        .empty-box { text-align: center; padding: 60px 20px; background: var(--card-bg); border: 1px dashed var(--border-color); border-radius: 12px; }
        .empty-box p { color: var(--text-sub); font-size: 16px; margin-bottom: 20px; }
    </style>
</head>
<body oncontextmenu="return false" onselectstart="return false" ondragstart="return false">

<nav class="navbar">
    <div class="nav-left">
        <a href="index.html" class="navbar-brand">🎬 시네마 로그</a>
        <ul class="nav-menu">
            <li><a href="index.html">메인</a></li>
            <li><a href="about.html">사이트 소개</a></li>
            <li><a href="detail.html" class="active">상세 페이지</a></li>
            <li><a href="favorites.html">⭐ 즐겨찾기</a></li>
            <li><a href="addForm.html">+ 감상평 등록</a></li>
        </ul>
    </div>
    <div>
        <button id="adminToggleBtn" class="admin-btn" onclick="toggleAdmin()">🔒 관리자 로그인</button>
    </div>
</nav>

<div class="container" id="mainContainer">
    <div style="text-align: center; padding: 50px; color: var(--text-sub);">데이터를 불러오는 중입니다...</div>
</div>

<script>
    const DIRECT_TMDB_KEY = '0de30fcff153e1d01942f9fe2e563d0b';

    // 🔒 단축키 차단
    document.addEventListener('keydown', function(e) {
        if (e.keyCode === 123) { e.preventDefault(); return false; }
        if (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) { e.preventDefault(); return false; }
        if (e.ctrlKey && e.keyCode === 85) { e.preventDefault(); return false; }
        if (e.ctrlKey && e.keyCode === 83) { e.preventDefault(); return false; }
    });

    function checkAdmin() {
        return localStorage.getItem('isAdmin') === 'true';
    }

    function updateAdminBtn() {
        const btn = document.getElementById('adminToggleBtn');
        if (checkAdmin()) {
            btn.innerText = "🔓 관리자 로그아웃";
            btn.classList.add('active');
        } else {
            btn.innerText = "🔒 관리자 로그인";
            btn.classList.remove('active');
        }
    }

    async function toggleAdmin() {
        if (checkAdmin()) {
            localStorage.setItem('isAdmin', 'false');
            alert('관리자 모드에서 로그아웃했습니다.');
            updateAdminBtn();
            location.reload();
        } else {
            const inputId = prompt("관리자 아이디를 입력하세요:");
            if (inputId === null) return;
            const inputPw = prompt("관리자 비밀번호를 입력하세요:");
            if (inputPw === null) return;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: inputId.trim(), password: inputPw.trim() })
                });

                if (res.ok) {
                    localStorage.setItem('isAdmin', 'true');
                    alert('관리자 로그인 성공!');
                    updateAdminBtn();
                    location.reload();
                } else {
                    alert('아이디 또는 비밀번호가 올바르지 않습니다.');
                }
            } catch (err) {
                alert('서버 응답 오류가 발생했습니다.');
            }
        }
    }

    // ----------------------------------------------------
    // ⭐ 즐겨찾기 (북마크) 관리 함수 (중복 저장 방지 적용)
    // ----------------------------------------------------
    function getBookmarks() {
        return JSON.parse(localStorage.getItem('myBookmarks') || localStorage.getItem('bookmarks') || '[]');
    }

    function isBookmarked(id) {
        const bookmarks = getBookmarks();
        return bookmarks.some(item => item.id == id);
    }

    // ✅ 즐겨찾기 목록 페이지(favorites.html)에서 바로 예쁘게 표시되도록
    //    포스터/평점/TMDB 여부까지 함께 저장한다.
    function toggleBookmark(movie) {
        let bookmarks = getBookmarks();
        const exists = bookmarks.some(item => item.id == movie.id);

        if (exists) {
            bookmarks = bookmarks.filter(item => item.id != movie.id);
            alert(`'${movie.title}' 항목을 즐겨찾기에서 해제했습니다.`);
        } else {
            bookmarks.push({
                id: movie.id,
                title: movie.title,
                genre: movie.genre || '기타',
                writer: movie.writer || '익명',
                content: movie.content || movie.overview || '',
                poster: movie.poster || null,
                vote: movie.vote || null,
                isTmdb: !!movie.isTmdb,
                createdAt: movie.createdAt || new Date().toISOString()
            });
            alert(`'${movie.title}' 항목을 즐겨찾기에 추가했습니다! ⭐`);
        }

        localStorage.setItem('myBookmarks', JSON.stringify(bookmarks));
        loadSingleDetail(movie.id);
    }

    // ----------------------------------------------------
    // 단일 게시글 상세 조회 화면 (서버 API 최우선 연동)
    // ----------------------------------------------------
    async function loadSingleDetail(id) {
        const container = document.getElementById('mainContainer');
        let movie = null;
        let isTmdb = false;

        // 1. 서버 감상평 DB API 조회
        try {
            const res = await fetch(`/api/movies/${id}`);
            if (res.ok) {
                movie = await res.json();
            }
        } catch (err) {
            console.log("DB API 조회 실패, 다른 소스 탐색 중...");
        }

        // 2. DB에 없다면 TMDB API 조회 시도
        if (!movie) {
            try {
                const tmdbRes = await fetch(`/api/tmdb/movie/${id}`);
                if (tmdbRes.ok) {
                    const tmdbData = await tmdbRes.json();
                    isTmdb = true;
                    movie = {
                        id: tmdbData.id,
                        title: tmdbData.title,
                        genre: tmdbData.genres && tmdbData.genres.length > 0 ? tmdbData.genres[0].name : 'TMDB 영화',
                        writer: 'TMDB 공식 정보',
                        content: tmdbData.overview || '줄거리 정보가 제공되지 않습니다.',
                        poster: tmdbData.poster_path ? `https://image.tmdb.org/t/p/w500${tmdbData.poster_path}` : null,
                        vote: tmdbData.vote_average,
                        createdAt: tmdbData.release_date,
                        isTmdb: true
                    };
                }
            } catch (err) {
                console.log("TMDB API 서버 조회 실패");
            }
        }

        // 3. 백엔드 연결 불가 시 로컬스토리지 보완
        if (!movie) {
            const localMovies = JSON.parse(localStorage.getItem('myMovies') || '[]');
            movie = localMovies.find(m => m.id == id);
        }

        // 4. 데이터가 없는 경우 예외 처리
        if (!movie) {
            container.innerHTML = `
                <div class="empty-box">
                    <p>⚠️ 해당 게시글을 찾을 수 없거나 삭제되었습니다.</p>
                    <a href="index.html" class="btn btn-primary">목록으로 돌아가기</a>
                </div>
            `;
            return;
        }

        const bookmarked = isBookmarked(movie.id);
        const dateStr = movie.createdAt ? new Date(movie.createdAt).toLocaleDateString('ko-KR') : '-';

        let bodyContent = `
            <div class="detail-content">${movie.content || '내용이 없습니다.'}</div>
        `;

        if (movie.poster) {
            bodyContent = `
                <div class="movie-detail-body">
                    <img src="${movie.poster}" class="poster-img" alt="${movie.title}">
                    <div class="detail-content">${movie.content}</div>
                </div>
            `;
        }

        const actionButtonsHtml = isTmdb ? `
            <span style="color: #f1c40f; font-weight: bold; font-size: 15px;">★ TMDB 평점: ${movie.vote ? movie.vote.toFixed(1) : 'N/A'}</span>
        ` : `
            <button class="btn btn-secondary" onclick="likeMovie('${movie.id}')">👍 추천하기</button>
        `;

        container.innerHTML = `
            <div style="margin-bottom: 15px;">
                <a href="index.html" class="btn btn-secondary">&larr; 목록으로</a>
            </div>
            <div class="detail-card">
                <div class="detail-header">
                    <div class="detail-title-row">
                        <h1 class="detail-title">${movie.title}</h1>
                        <span class="genre-badge" style="background:#0f172a; border:1px solid var(--border-color); color:var(--accent-color); font-size:12px; padding:3px 8px; border-radius:12px; font-weight:bold;">${movie.genre || '기타'}</span>
                    </div>
                    <div class="detail-meta">
                        <span>✍️ 작성자: ${movie.writer || '익명'}</span>
                        <span>📅 작성일/개봉일: ${dateStr}</span>
                        ${!isTmdb ? `<span>👁️ 조회수: ${movie.views || 0}</span>` : ''}
                        ${!isTmdb ? `<span>👍 추천수: <span id="likeCount">${movie.likes || 0}</span></span>` : ''}
                    </div>
                </div>
                
                ${bodyContent}
                
                <div class="action-bar">
                    <button class="btn btn-star ${bookmarked ? 'active' : ''}" id="starBtn">
                        ${bookmarked ? '★ 즐겨찾기 해제' : '☆ 즐겨찾기 추가'}
                    </button>
                    <div class="btn-group">
                        ${actionButtonsHtml}
                        <a href="index.html" class="btn btn-primary">목록으로</a>
                    </div>
                </div>
            </div>
        `;

        document.getElementById('starBtn').onclick = () => toggleBookmark(movie);
    }

    async function likeMovie(id) {
        try {
            const res = await fetch(`/api/movies/${id}/like`, { method: 'POST' });
            if (res.ok) {
                const data = await res.json();
                const elem = document.getElementById('likeCount');
                if (elem) elem.innerText = data.likes;
                alert('추천되었습니다!');
            } else {
                likeLocalMovie(id);
            }
        } catch (err) {
            likeLocalMovie(id);
        }
    }

    function likeLocalMovie(id) {
        let localMovies = JSON.parse(localStorage.getItem('myMovies') || '[]');
        localMovies = localMovies.map(m => {
            if (m.id == id) {
                const likes = (m.likes || 0) + 1;
                const elem = document.getElementById('likeCount');
                if (elem) elem.innerText = likes;
                return { ...m, likes };
            }
            return m;
        });
        localStorage.setItem('myMovies', JSON.stringify(localMovies));
        alert('추천되었습니다!');
    }

    // 초기화 실행 — id가 없으면 즐겨찾기 모음 페이지로 이동
    window.onload = () => {
        updateAdminBtn();

        const urlParams = new URLSearchParams(window.location.search);
        const movieId = urlParams.get('id');

        if (movieId) {
            loadSingleDetail(movieId);
        } else {
            window.location.href = 'favorites.html';
        }
    };
</script>
</body>
</html>
