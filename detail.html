<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시네마 로그 - 즐겨찾기 감상평 상세</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-color: #6c5ce7;
            --accent-hover: #5b4bc4;
            --border-color: #334155;
            --danger-color: #ef4444;
            --danger-hover: #dc2626;
            --warning-color: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Pretendard', sans-serif; background-color: var(--bg-color); color: var(--text-main); padding-bottom: 50px; }

        .navbar { background-color: var(--card-bg); display: flex; align-items: center; justify-content: space-between; padding: 15px 40px; border-bottom: 1px solid var(--border-color); }
        .nav-left { display: flex; align-items: center; gap: 30px; }
        .navbar-brand { font-size: 20px; font-weight: bold; color: var(--text-main); text-decoration: none; }
        .nav-menu { list-style: none; display: flex; gap: 20px; align-items: center; }
        .nav-menu a { color: var(--text-sub); text-decoration: none; font-weight: bold; transition: 0.2s; }
        .nav-menu a:hover, .nav-menu a.active { color: var(--accent-color); }

        .admin-btn { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border-color); background: #0f172a; color: var(--text-sub); cursor: pointer; font-size: 13px; font-weight: bold; }
        .admin-btn.active { background: var(--accent-color); color: white; border-color: var(--accent-color); }

        .container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        
        .detail-card { 
            background-color: var(--card-bg); 
            border: 1px solid var(--border-color); 
            border-radius: 12px; 
            padding: 30px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .detail-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; border-bottom: 1px solid var(--border-color); }
        .detail-title { font-size: 24px; font-weight: bold; display: flex; align-items: center; gap: 10px; }
        .genre-badge { background: #0f172a; border: 1px solid var(--border-color); color: var(--accent-color); font-size: 13px; padding: 4px 10px; border-radius: 12px; font-weight: bold; }
        
        .favorite-btn { background: transparent; border: 1px solid var(--warning-color); color: var(--warning-color); padding: 6px 14px; border-radius: 20px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .favorite-btn.active { background: var(--warning-color); color: black; }

        .detail-info { background: #0f172a; padding: 12px 20px; border-radius: 8px; margin: 20px 0; display: flex; gap: 20px; font-size: 14px; color: var(--text-sub); border: 1px solid var(--border-color); }

        .detail-content { font-size: 16px; line-height: 1.8; color: var(--text-main); background: #0f172a; padding: 25px; border-radius: 8px; border: 1px solid var(--border-color); min-height: 180px; white-space: pre-line; word-break: break-all; }

        .like-section { text-align: center; margin: 30px 0; }
        .like-btn { background: transparent; border: 1px solid var(--warning-color); color: var(--warning-color); padding: 10px 24px; border-radius: 25px; cursor: pointer; font-size: 15px; font-weight: bold; transition: 0.2s; }
        .like-btn:hover { background: var(--warning-color); color: black; }

        /* ⭐ 즐겨찾기 전용 내비게이션 바 */
        .fav-navigation { background: #0f172a; border: 1px solid var(--border-color); padding: 15px 20px; border-radius: 8px; margin-top: 25px; display: flex; justify-content: space-between; align-items: center; }
        .fav-navigation span { font-size: 14px; color: var(--text-sub); }

        .btn-group { display: flex; justify-content: space-between; align-items: center; margin-top: 30px; border-top: 1px solid var(--border-color); padding-top: 20px; }
        .left-btns, .right-btns { display: flex; gap: 10px; }

        .btn { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s; text-decoration: none; display: inline-block; }
        .btn-secondary { background-color: #334155; color: white; }
        .btn-secondary:hover { background-color: #475569; }
        
        .btn-primary { background-color: var(--accent-color); color: white; }
        .btn-primary:hover { background-color: var(--accent-hover); }

        .btn-danger { background-color: var(--danger-color); color: white; }
        .btn-danger:hover { background-color: var(--danger-hover); }

        .btn-warning { background-color: var(--warning-color); color: black; }

        .empty-fav-msg { text-align: center; padding: 60px 20px; color: var(--text-sub); }
        .empty-fav-msg h3 { margin-bottom: 10px; color: var(--text-main); }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="nav-left">
        <a href="index.html" class="navbar-brand">🎬 시네마 로그</a>
        <ul class="nav-menu">
            <li><a href="index.html">메인</a></li>
            <li><a href="about.html">사이트 소개</a></li>
            <li><a href="#" class="active">⭐ 즐겨찾기 상세페이지</a></li>
            <li><a href="addForm.html">+ 감상평 등록</a></li>
        </ul>
    </div>
    <div>
        <button id="adminToggleBtn" class="admin-btn" onclick="toggleAdmin()">🔒 관리자 로그인</button>
    </div>
</nav>

<div class="container">
    <div class="detail-card" id="cardContainer">
        <div class="detail-header">
            <div class="detail-title">
                <span id="movieTitle">로딩 중...</span>
                <span class="genre-badge" id="movieGenre">-</span>
            </div>
            <button class="favorite-btn" id="favToggleBtn" onclick="toggleFavorite()">★ 즐겨찾기 해제</button>
        </div>

        <div class="detail-info">
            <span>✍️ 작성자: <strong id="movieWriter" style="color:var(--text-main);">-</strong></span>
            <span>👁️ 조회수: <strong id="movieViews" style="color:var(--text-main);">0</strong></span>
            <span>👍 추천수: <strong id="movieLikes" style="color:var(--text-main);">0</strong></span>
        </div>

        <div class="detail-content" id="movieContent">
            즐겨찾기된 감상평을 불러오는 중입니다...
        </div>

        <div class="like-section">
            <button class="like-btn" onclick="likeMovie()">👍 이 감상평 추천하기</button>
        </div>

        <!-- ⭐ 즐겨찾기 목록 이동 가이드 -->
        <div class="fav-navigation">
            <button type="button" class="btn btn-secondary" id="prevFavBtn" onclick="navigateFav(-1)">&larr; 이전 즐겨찾기</button>
            <span id="favIndexText">즐겨찾기 감상평 목록 불러오는 중...</span>
            <button type="button" class="btn btn-secondary" id="nextFavBtn" onclick="navigateFav(1)">다음 즐겨찾기 &rarr;</button>
        </div>

        <!-- 🔘 버튼 그룹 -->
        <div class="btn-group">
            <div class="left-btns">
                <a href="index.html" class="btn btn-secondary">목록으로</a>
            </div>
            <div class="right-btns">
                <button type="button" id="hideBtn" class="btn btn-warning" style="display: none;" onclick="toggleHide()"></button>
                <button type="button" class="btn btn-primary" onclick="goEdit()">수정</button>
                <button type="button" class="btn btn-danger" onclick="deleteMovie()">삭제</button>
            </div>
        </div>
    </div>
</div>

<script>
    let movieId = new URLSearchParams(window.location.search).get('id');
    let currentMovie = null;
    let favoriteIds = JSON.parse(localStorage.getItem('favMovies') || '[]');
    let currentFavIndex = 0;

    function checkAdmin() {
        return localStorage.getItem('isAdmin') === 'true';
    }

    function updateAdminBtn() {
        const btn = document.getElementById('adminToggleBtn');
        if (checkAdmin()) {
            btn.innerText = "🔓 관리자 로그아웃";
            btn.classList.add('active');
        } else {
            btn.innerText = "🔒 관리자 로그인";
            btn.classList.remove('active');
        }
    }

    async function toggleAdmin() {
        if (checkAdmin()) {
            localStorage.setItem('isAdmin', 'false');
            alert('관리자 모드에서 로그아웃했습니다.');
            location.reload();
        } else {
            const inputId = prompt("관리자 아이디를 입력하세요:");
            if (inputId === null) return;
            const inputPw = prompt("관리자 비밀번호를 입력하세요:");
            if (inputPw === null) return;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: inputId.trim(), password: inputPw.trim() })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    localStorage.setItem('isAdmin', 'true');
                    alert('관리자 로그인 성공!');
                    location.reload();
                } else {
                    alert(result.message || '로그인 실패');
                }
            } catch (error) {
                alert('서버와 통신할 수 없습니다.');
            }
        }
    }

    // ⭐ 즐겨찾기된 감상평만 조회하는 로직
    async function loadFavoriteDetail() {
        favoriteIds = JSON.parse(localStorage.getItem('favMovies') || '[]');

        // 즐겨찾기된 목록이 하나도 없는 경우 처리
        if (favoriteIds.length === 0) {
            document.getElementById('cardContainer').innerHTML = `
                <div class="empty-fav-msg">
                    <h3>⭐ 즐겨찾기된 감상평이 없습니다.</h3>
                    <p style="margin-bottom:20px;">메인 화면에서 감상평을 읽고 '즐겨찾기'를 등록해 보세요!</p>
                    <a href="index.html" class="btn btn-primary">메인 목록으로 가기</a>
                </div>
            `;
            return;
        }

        // URL의 id가 없거나 즐겨찾기 목록에 없으면 첫 번째 즐겨찾기 항목 선택
        if (!movieId || !favoriteIds.includes(Number(movieId))) {
            movieId = favoriteIds[0];
        }

        currentFavIndex = favoriteIds.indexOf(Number(movieId));

        try {
            const res = await fetch(`/api/movies/${movieId}`);
            if (!res.ok) throw new Error('게시글을 찾을 수 없습니다.');

            currentMovie = await res.json();

            document.getElementById('movieTitle').innerText = currentMovie.title;
            document.getElementById('movieGenre').innerText = currentMovie.genre || '기타';
            document.getElementById('movieWriter').innerText = currentMovie.writer;
            document.getElementById('movieViews').innerText = currentMovie.views;
            document.getElementById('movieLikes').innerText = currentMovie.likes || 0;
            document.getElementById('movieContent').innerText = currentMovie.content;

            // 즐겨찾기 상태 및 내비게이션 UI 업데이트
            document.getElementById('favIndexText').innerText = `⭐ 즐겨찾기 감상평 (${currentFavIndex + 1} / ${favoriteIds.length})`;
            
            // 이전/다음 버튼 활성화 상태
            document.getElementById('prevFavBtn').disabled = (currentFavIndex === 0);
            document.getElementById('nextFavBtn').disabled = (currentFavIndex === favoriteIds.length - 1);

            if (checkAdmin()) {
                const hideBtn = document.getElementById('hideBtn');
                hideBtn.style.display = 'inline-block';
                hideBtn.innerText = currentMovie.isHidden ? '🔓 숨김 해제' : '🙈 숨김 처리';
            }

        } catch (err) {
            alert('즐겨찾기 게시글을 불러오는데 실패했습니다.');
            window.location.href = 'index.html';
        }
    }

    // ⭐ 즐겨찾기 해제 기능
    function toggleFavorite() {
        const idNum = Number(movieId);
        favoriteIds = favoriteIds.filter(id => id !== idNum);
        localStorage.setItem('favMovies', JSON.stringify(favoriteIds));
        alert('즐겨찾기 목록에서 삭제되었습니다.');
        loadFavoriteDetail();
    }

    // ⭐ 즐겨찾기 목록 이전/다음 이동
    function navigateFav(direction) {
        const newIndex = currentFavIndex + direction;
        if (newIndex >= 0 && newIndex < favoriteIds.length) {
            window.location.href = `detail.html?id=${favoriteIds[newIndex]}`;
        }
    }

    // 👍 추천 기능
    async function likeMovie() {
        try {
            const res = await fetch(`/api/movies/${movieId}/like`, { method: 'POST' });
            const data = await res.json();
            document.getElementById('movieLikes').innerText = data.likes;
            alert('이 감상평을 추천했습니다! 👍');
        } catch (err) {
            alert('추천 처리 중 오류가 발생했습니다.');
        }
    }

    function goEdit() {
        window.location.href = `addForm.html?id=${movieId}`;
    }

    async function deleteMovie() {
        if (!confirm('정말로 이 영화 감상평을 삭제하시겠습니까?')) return;

        try {
            const res = await fetch(`/api/movies/${movieId}`, { method: 'DELETE' });
            if (res.ok) {
                toggleFavorite(); // 즐겨찾기 목록에서도 함께 제외
                alert('감상평이 삭제되었습니다.');
            } else {
                alert('삭제 실패');
            }
        } catch (err) {
            alert('삭제 처리 오류');
        }
    }

    async function toggleHide() {
        const newStatus = currentMovie.isHidden ? 0 : 1;
        try {
            const res = await fetch(`/api/movies/${movieId}/hide`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ isHidden: newStatus })
            });

            if (res.ok) {
                alert(newStatus ? '게시글이 숨김 처리되었습니다.' : '숨김이 해제되었습니다.');
                location.reload();
            }
        } catch (err) {
            alert('오류 발생');
        }
    }

    window.onload = () => {
        updateAdminBtn();
        loadFavoriteDetail();
    };
</script>
</body>
</html>
