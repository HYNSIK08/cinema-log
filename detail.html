<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시네마 로그 - 감상평 상세 보기</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-color: #6c5ce7;
            --accent-hover: #5b4bc4;
            --border-color: #334155;
            --danger-color: #ef4444;
        }

        /* 🔒 보안: 우클릭/드래그 차단 */
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { font-family: 'Pretendard', sans-serif; background-color: var(--bg-color); color: var(--text-main); padding-bottom: 50px; }

        .navbar { background-color: var(--card-bg); display: flex; align-items: center; justify-content: space-between; padding: 15px 40px; border-bottom: 1px solid var(--border-color); }
        .navbar-brand { font-size: 20px; font-weight: bold; color: var(--text-main); text-decoration: none; }
        .nav-menu { list-style: none; display: flex; gap: 20px; }
        .nav-menu a { color: var(--text-sub); text-decoration: none; font-weight: bold; transition: 0.2s; }
        .nav-menu a:hover { color: var(--accent-color); }

        .container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        
        .detail-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 35px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .detail-header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        .title-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .movie-title { font-size: 28px; font-weight: bold; color: var(--text-main); }
        .genre-badge { background: #0f172a; border: 1px solid var(--border-color); color: var(--accent-color); font-size: 14px; padding: 5px 12px; border-radius: 20px; font-weight: bold; }

        .meta-info {
            display: flex;
            gap: 20px;
            font-size: 14px;
            color: var(--text-sub);
        }

        .content-area {
            font-size: 16px;
            line-height: 1.8;
            color: #e2e8f0;
            min-height: 180px;
            white-space: pre-line;
            word-break: break-all;
            margin-bottom: 30px;
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }

        .btn { padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; border: none; font-size: 14px; transition: 0.2s; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
        .btn-back { background: #334155; color: white; }
        .btn-back:hover { background: #475569; }
        .btn-like { background: rgba(108, 92, 231, 0.2); color: var(--accent-color); border: 1px solid var(--accent-color); }
        .btn-like:hover { background: var(--accent-color); color: white; }
    </style>
</head>
<body oncontextmenu="return false" onselectstart="return false">

<nav class="navbar">
    <a href="index.html" class="navbar-brand">🎬 시네마 로그</a>
    <ul class="nav-menu">
        <li><a href="index.html">메인으로</a></li>
        <li><a href="addForm.html">+ 감상평 작성</a></li>
    </ul>
</nav>

<div class="container">
    <div class="detail-card" id="detailCard">
        <div style="text-align:center; padding: 40px; color: var(--text-sub);">
            감상평을 불러오는 중입니다...
        </div>
    </div>
</div>

<script>
    // F12 및 소스보기 금지
    document.addEventListener('keydown', function(e) {
        if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) || (e.ctrlKey && e.keyCode === 85)) {
            e.preventDefault();
            return false;
        }
    });

    // URL 파라미터에서 영화 ID 가져오기
    function getQueryParam(param) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param);
    }

    async function loadMovieDetail() {
        const id = getQueryParam('id');
        const cardContainer = document.getElementById('detailCard');

        if (!id) {
            cardContainer.innerHTML = `
                <div style="text-align:center;">
                    <h2>🚫 잘못된 접근입니다.</h2>
                    <br><a href="index.html" class="btn btn-back">목록으로 돌아가기</a>
                </div>`;
            return;
        }

        try {
            const res = await fetch(`/api/movies/${id}`);
            if (!res.ok) throw new Error('데이터 로드 실패');

            const movie = await res.json();
            const dateStr = movie.createdAt ? new Date(movie.createdAt).toLocaleDateString('ko-KR') : '2026. 08. 04';

            cardContainer.innerHTML = `
                <div class="detail-header">
                    <div class="title-area">
                        <h1 class="movie-title">${movie.title}</h1>
                        <span class="genre-badge">${movie.genre || '기타'}</span>
                    </div>
                    <div class="meta-info">
                        <span>✍️ 작성자: <strong>${movie.writer}</strong></span>
                        <span>📅 작성일: ${dateStr}</span>
                        <span>👁️ 조회수: ${movie.views || 0}</span>
                    </div>
                </div>

                <div class="content-area">
                    ${movie.content || '등록된 감상평 내용이 없습니다.'}
                </div>

                <div class="action-bar">
                    <a href="index.html" class="btn btn-back">&larr; 목록으로</a>
                    <button class="btn btn-like" onclick="likeMovie('${movie.id}')">👍 추천 (<span id="likeCount">${movie.likes || 0}</span>)</button>
                </div>
            `;
        } catch (err) {
            console.error(err);
            cardContainer.innerHTML = `
                <div style="text-align:center;">
                    <h2>⚠️ 감상평을 찾을 수 없습니다.</h2>
                    <br><a href="index.html" class="btn btn-back">목록으로 돌아가기</a>
                </div>`;
        }
    }

    async function likeMovie(id) {
        try {
            const res = await fetch(`/api/movies/${id}/like`, { method: 'POST' });
            if (res.ok) {
                const data = await res.json();
                document.getElementById('likeCount').innerText = data.likes;
            }
        } catch (err) {
            alert('추천 처리 중 오류가 발생했습니다.');
        }
    }

    window.onload = loadMovieDetail;
</script>
</body>
</html>
