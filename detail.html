<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>영화 감상 상세 - 시네마 로그</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #f4f6f9; margin: 40px 0; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { color: #3b3b98; margin-top: 0; }
        .info { background: #f8f9fa; padding: 15px 20px; border-radius: 8px; margin: 20px 0; line-height: 1.8; }
        .content-box { white-space: pre-wrap; line-height: 1.7; border: 1px solid #e9ecef; padding: 20px; border-radius: 8px; background: #fff; min-height: 100px; }
        .btn-group { margin-top: 25px; display: flex; gap: 10px; }
        .btn { padding: 9px 18px; color: white; text-decoration: none; border-radius: 6px; border: none; cursor: pointer; font-size: 14px; display: inline-block; }
        .btn-list { background-color: #7f8c8d; }
        .btn-edit { background-color: #3b3b98; }
        .btn-delete { background-color: #e74c3c; }
    </style>
</head>
<body>
<div class="container">
    <h2 id="movieTitle"></h2>
    
    <div class="info">
        <div><strong>작성자:</strong> <span id="movieWriter"></span></div>
        <div><strong>조회수:</strong> <span id="movieViews"></span></div>
    </div>
    
    <h3 style="font-size: 16px; color: #333;">장르 및 감상평</h3>
    <div class="content-box" id="movieContent"></div>

    <div class="btn-group">
        <a href="list.html" class="btn btn-list">목록으로</a>
        <a id="editBtn" class="btn btn-edit">수정</a>
        <button type="button" class="btn btn-delete" onclick="deleteMovie()">삭제</button>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const movieId = Number(urlParams.get('id')) || 1;
    let movies = JSON.parse(localStorage.getItem('movies')) || [];
    let movieIndex = movies.findIndex(m => m.id === movieId);

    if (movieIndex !== -1) {
        // 조회수 1 증가 (도전형 요구사항)
        movies[movieIndex].views += 1;
        localStorage.setItem('movies', JSON.stringify(movies));

        const movie = movies[movieIndex];
        document.getElementById('movieTitle').innerText = movie.title;
        document.getElementById('movieWriter').innerText = movie.writer;
        document.getElementById('movieViews').innerText = movie.views;
        document.getElementById('movieContent').innerText = movie.content;
        document.getElementById('editBtn').href = `editForm.html?id=${movie.id}`;
    }

    function deleteMovie() {
        if (confirm("정말로 이 감상평을 삭제하시겠습니까?")) {
            movies = movies.filter(m => m.id !== movieId);
            localStorage.setItem('movies', JSON.stringify(movies));
            alert("삭제되었습니다.");
            window.location.href = "list.html";
        }
    }
</script>
</body>
</html>
