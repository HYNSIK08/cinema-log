<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사이트 소개 - 시네마 로그</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-color: #6c5ce7;
            --border-color: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Pretendard', sans-serif; background-color: var(--bg-color); color: var(--text-main); padding-bottom: 50px; }

        .navbar { background-color: var(--card-bg); display: flex; align-items: center; padding: 15px 40px; border-bottom: 1px solid var(--border-color); }
        .nav-left { display: flex; align-items: center; gap: 30px; }
        .navbar-brand { font-size: 20px; font-weight: bold; color: var(--text-main); text-decoration: none; }
        .nav-menu { list-style: none; display: flex; gap: 20px; align-items: center; }
        .nav-menu a { color: var(--text-sub); text-decoration: none; font-weight: bold; transition: 0.2s; }
        .nav-menu a:hover, .nav-menu a.active { color: var(--accent-color); }

        .container { max-width: 700px; margin: 50px auto; background: var(--card-bg); padding: 40px; border-radius: 12px; border: 1px solid var(--border-color); }
        h1 { color: var(--text-main); border-bottom: 2px solid var(--accent-color); padding-bottom: 12px; margin-bottom: 20px; }
        p { line-height: 1.8; color: var(--text-sub); font-size: 15px; }
        .feature-box { background: #0f172a; border: 1px solid var(--border-color); padding: 20px; border-radius: 8px; margin-top: 20px; }
        .feature-box h3 { margin-bottom: 12px; color: var(--text-main); }
        .feature-box ul { padding-left: 20px; color: var(--text-sub); line-height: 1.8; }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="nav-left">
        <a href="index.html" class="navbar-brand">🎬 시네마 로그</a>
        <ul class="nav-menu">
            <li><a href="index.html">메인</a></li>
            <li><a href="about.html" class="active">사이트 소개</a></li>
            <li><a href="addForm.html">+ 감상평 등록</a></li>
        </ul>
    </div>
</nav>

<div class="container">
    <h1>📌 시네마 로그 소개</h1>
    <p><strong>시네마 로그(Cinema Log)</strong>는 당신이 감상한 영화의 감동과 여운을 간편하게 기록하고 정리할 수 있는 개인 영화 기록 웹 서비스입니다.</p>
    <div class="feature-box">
        <h3>주요 기능</h3>
        <ul>
            <li><strong>영화 기록:</strong> 영화 제목, 작성자, 감상평 등록</li>
            <li><strong>실시간 검색:</strong> 영화 제목 키워드로 데이터베이스 통합 검색</li>
            <li><strong>상세보기 및 수정/삭제:</strong> REST API 기반 데이터 관리</li>
            <li><strong>영구 저장:</strong> Node.js와 SQLite DB를 통한 서버 데이터 지속성</li>
        </ul>
    </div>
</div>
</body>
</html>
