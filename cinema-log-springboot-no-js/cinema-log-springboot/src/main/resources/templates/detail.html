<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${movie.title}">상세</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><nav class="nav"><div class="nav-links"><a th:href="@{/}"><b>🎬 시네마 로그</b></a><a th:href="@{/favorites}">즐겨찾기</a><a th:href="@{/movies/new}">감상평 등록</a></div><a class="btn secondary" th:href="@{/}">목록</a></nav><main class="container"><div th:if="${message}" class="flash" th:text="${message}"></div><article class="card"><div class="hidden-badge" th:if="${movie.hidden}">숨김 상태</div><h1 class="title" th:text="${movie.title}"></h1><div class="meta"><span th:text="|장르 ${movie.genre ?: '기타'}|"></span><span th:text="|작성자 ${movie.writer ?: '익명'}|"></span><span th:text="|조회 ${movie.views}|"></span><span th:text="|추천 ${movie.likes}|"></span></div><hr style="border-color:#334155"><div class="content" th:text="${movie.content}"></div><div class="toolbar"><form method="post" th:action="@{/movies/{id}/like(id=${movie.id})}"><button>👍 추천</button></form><form method="post" th:action="@{/favorites/{id}(id=${movie.id})}"><input type="hidden" name="returnTo" th:value="|/movies/${movie.id}|"><button class="gold" th:text="${favorite ? '★ 즐겨찾기 해제' : '☆ 즐겨찾기'}"></button></form><a th:if="${admin}" class="btn secondary" th:href="@{/movies/{id}/edit(id=${movie.id})}">수정</a><form th:if="${admin}" method="post" th:action="@{/movies/{id}/hide(id=${movie.id})}"><button class="secondary" th:text="${movie.hidden ? '숨김 해제' : '숨기기'}"></button></form><form th:if="${admin}" method="post" th:action="@{/movies/{id}/delete(id=${movie.id})}"><button class="danger">삭제</button></form></div></article><section style="margin-top:28px"><h2>연관 감상평</h2><div class="grid"><article class="movie-card" th:each="item : ${related}"><h3><a th:href="@{/movies/{id}(id=${item.id})}" th:text="${item.title}"></a></h3><p class="muted" th:text="|${item.genre ?: '기타'} · ${item.writer ?: '익명'}|"></p></article></div><p class="muted" th:if="${#lists.isEmpty(related)}">연관된 감상평이 없습니다.</p></section></main></body></html>
