<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${edit ? '감상평 수정' : '감상평 등록'}"></title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><nav class="nav"><a th:href="@{/}"><b>🎬 시네마 로그</b></a><a class="btn secondary" th:href="@{/}">취소</a></nav><main class="container"><form class="card" method="post" th:object="${movieForm}" th:action="${edit} ? @{/movies/{id}(id=${movieId})} : @{/movies}"><h1 th:text="${edit ? '감상평 수정' : '감상평 등록'}"></h1><div class="form-row"><label>영화 제목</label><input th:field="*{title}"><p class="error" th:errors="*{title}"></p></div><div class="form-row"><label>장르</label><select th:field="*{genre}"><option value="">선택</option><option>액션</option><option>드라마</option><option>코미디</option><option>애니메이션</option><option>공포</option><option>기타</option></select></div><div class="form-row"><label>작성자</label><input th:field="*{writer}"></div><div class="form-row"><label>감상 내용</label><textarea th:field="*{content}"></textarea></div><button th:text="${edit ? '수정 완료' : '등록'}"></button></form></main></body></html>
