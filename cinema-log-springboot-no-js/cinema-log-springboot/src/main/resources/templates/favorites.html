<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>즐겨찾기</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><nav class="nav"><a th:href="@{/}"><b>🎬 시네마 로그</b></a><a class="btn secondary" th:href="@{/}">메인</a></nav><main class="container"><h1>⭐ 즐겨찾기</h1><div class="grid"><article class="movie-card" th:each="movie : ${movies}"><h3><a th:href="@{/movies/{id}(id=${movie.id})}" th:text="${movie.title}"></a></h3><p class="muted" th:text="|${movie.genre ?: '기타'} · ${movie.writer ?: '익명'}|"></p><form method="post" th:action="@{/favorites/{id}(id=${movie.id})}"><input type="hidden" name="returnTo" value="/favorites"><button class="secondary">즐겨찾기 해제</button></form></article></div><p class="muted" th:if="${#lists.isEmpty(movies)}">즐겨찾기한 감상평이 없습니다.</p></main></body></html>
