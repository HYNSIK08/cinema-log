<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시네마 로그 - 즐겨찾기</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-color: #6c5ce7;
            --accent-hover: #5b4bc4;
            --border-color: #334155;
            --danger-color: #ef4444;
            --danger-hover: #dc2626;
            --star-color: #f1c40f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        body { font-family: 'Pretendard', sans-serif; background-color: var(--bg-color); color: var(--text-main); padding-bottom: 50px; line-height: 1.6; }

        .navbar { background-color: var(--card-bg); display: flex; align-items: center; justify-content: space-between; padding: 15px 40px; border-bottom: 1px solid var(--border-color); }
        .nav-left { display: flex; align-items: center; gap: 30px; }
        .navbar-brand { font-size: 20px; font-weight: bold; color: var(--text-main); text-decoration: none; }
        .nav-menu { list-style: none; display: flex; gap: 20px; align-items: center; }
        .nav-menu a { color: var(--text-sub); text-decoration: none; font-weight: bold; transition: 0.2s; }
        .nav-menu a:hover, .nav-menu a.active { color: var(--accent-color); }

        .admin-btn { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border-color); background: #0f172a; color: var(--text-sub); cursor: pointer; font-size: 13px; font-weight: bold; }
        .admin-btn.active { background: var(--accent-color); color: white; border-color: var(--accent-color); }

        .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }

        .page-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 25px; border-bottom: 2px solid var(--border-color); padding-bottom: 18px; }
        .page-header h1 { font-size: 24px; color: var(--text-main); display: flex; align-items: center; gap: 10px; }
        .page-header p { font-size: 13px; color: var(--text-sub); margin-top: 4px; }
        .btn-clear-all { padding: 8px 14px; background-color: var(--danger-color); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .btn-clear-all:hover { background-color: var(--danger-hover); }

        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 20px; }

        .fav-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            position: relative;
        }
        .fav-card:hover { transform: translateY(-5px); border-color: var(--accent-color); }

        .fav-poster { width: 100%; height: 260px; object-fit: cover; background: #0f172a; display: block; }
        .fav-poster-fallback {
            width: 100%; height: 260px; display: flex; align-items: center; justify-content: center;
            font-size: 46px; background: linear-gradient(135deg, #1e293b, #0f172a); color: var(--text-sub);
        }

        .remove-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(15, 23, 42, 0.75);
            border: none;
            color: var(--star-color);
            font-size: 16px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }
        .remove-btn:hover { background: var(--danger-color); color: white; }

        .fav-body { padding: 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
        .fav-title-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
        .fav-title { font-size: 15px; font-weight: bold; color: var(--text-main); word-break: break-word; }
        .genre-badge { background: #0f172a; border: 1px solid var(--border-color); color: var(--accent-color); font-size: 11px; padding: 2px 7px; border-radius: 10px; font-weight: bold; flex-shrink: 0; white-space: nowrap; }
        .fav-meta { font-size: 12px; color: var(--text-sub); display: flex; justify-content: space-between; align-items: center; }
        .fav-vote { color: var(--star-color); font-weight: bold; }

        .empty-box { text-align: center; padding: 70px 20px; background: var(--card-bg); border: 1px dashed var(--border-color); border-radius: 12px; }
        .empty-box .icon { font-size: 42px; margin-bottom: 14px; }
        .empty-box p { color: var(--text-sub); font-size: 15px; margin-bottom: 20px; }
        .empty-box p.sub { font-size: 13px; }

        .btn { padding: 12px 20px; background-color: var(--accent-color); color: white; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s; text-decoration: none; display: inline-block; }
        .btn:hover { background-color: var(--accent-hover); }
    </style>
</head>
<body oncontextmenu="return false" onselectstart="return false" ondragstart="return false">

<nav class="navbar">
    <div class="nav-left">
        <a href="index.html" class="navbar-brand">🎬 시네마 로그</a>
        <ul class="nav-menu">
            <li><a href="index.html">메인</a></li>
            <li><a href="about.html">사이트 소개</a></li>
            <li><a href="detail.html">상세 페이지</a></li>
            <li><a href="favorites.html" class="active">⭐ 즐겨찾기</a></li>
            <li><a href="addForm.html">+ 감상평 등록</a></li>
        </ul>
    </div>
    <div>
        <button id="adminToggleBtn" class="admin-btn" onclick="toggleAdmin()">🔒 관리자 로그인</button>
    </div>
</nav>

<div class="container">
    <div class="page-header">
        <div>
            <h1 id="pageTitle">⭐ 내가 즐겨찾기한 영화</h1>
            <p>메인의 TMDB 카드나 상세 페이지에서 ★을 누르면 이곳에 모입니다.</p>
        </div>
        <button id="clearAllBtn" class="btn-clear-all" style="display:none;" onclick="clearAllBookmarks()">🗑️ 전체 해제</button>
    </div>

    <div class="grid-container" id="favGrid"></div>
</div>

<script>
    // 🔒 단축키 차단
    document.addEventListener('keydown', function (e) {
        if (e.keyCode === 123) { e.preventDefault(); return false; }
        if (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) { e.preventDefault(); return false; }
        if (e.ctrlKey && e.keyCode === 85) { e.preventDefault(); return false; }
        if (e.ctrlKey && e.keyCode === 83) { e.preventDefault(); return false; }
    });

    function checkAdmin() {
        return localStorage.getItem('isAdmin') === 'true';
    }

    function updateAdminBtn() {
        const btn = document.getElementById('adminToggleBtn');
        if (checkAdmin()) {
            btn.innerText = "🔓 관리자 로그아웃";
            btn.classList.add('active');
        } else {
            btn.innerText = "🔒 관리자 로그인";
            btn.classList.remove('active');
        }
    }

    async function toggleAdmin() {
        if (checkAdmin()) {
            localStorage.setItem('isAdmin', 'false');
            alert('관리자 모드에서 로그아웃했습니다.');
            updateAdminBtn();
        } else {
            const inputId = prompt("관리자 아이디를 입력하세요:");
            if (inputId === null) return;
            const inputPw = prompt("관리자 비밀번호를 입력하세요:");
            if (inputPw === null) return;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: inputId.trim(), password: inputPw.trim() })
                });

                if (res.ok) {
                    localStorage.setItem('isAdmin', 'true');
                    alert('관리자 로그인 성공!');
                    updateAdminBtn();
                } else {
                    alert('아이디 또는 비밀번호가 올바르지 않습니다.');
                }
            } catch (err) {
                alert('서버 응답 오류가 발생했습니다.');
            }
        }
    }

    // ----------------------------------------------------
    // ⭐ 즐겨찾기 데이터 (index.html / detail.html 과 동일한 myBookmarks 키 사용)
    // ----------------------------------------------------
    function getBookmarks() {
        return JSON.parse(localStorage.getItem('myBookmarks') || localStorage.getItem('bookmarks') || '[]');
    }

    function saveBookmarks(bookmarks) {
        localStorage.setItem('myBookmarks', JSON.stringify(bookmarks));
    }

    function removeBookmark(event, id) {
        event.stopPropagation();
        let bookmarks = getBookmarks();
        bookmarks = bookmarks.filter(b => b.id != id);
        saveBookmarks(bookmarks);
        renderFavorites();
    }

    function clearAllBookmarks() {
        if (!confirm('⚠️ 즐겨찾기한 항목을 전부 해제하시겠습니까?\n이 작업은 되돌릴 수 없습니다.')) return;
        localStorage.removeItem('myBookmarks');
        renderFavorites();
    }

    // ----------------------------------------------------
    // 즐겨찾기 그리드 렌더링
    // ----------------------------------------------------
    function renderFavorites() {
        const grid = document.getElementById('favGrid');
        const clearAllBtn = document.getElementById('clearAllBtn');
        const pageTitle = document.getElementById('pageTitle');
        const bookmarks = getBookmarks();

        pageTitle.innerText = `⭐ 내가 즐겨찾기한 영화 (${bookmarks.length}개)`;
        clearAllBtn.style.display = bookmarks.length > 0 ? 'inline-block' : 'none';

        if (bookmarks.length === 0) {
            grid.innerHTML = '';
            grid.style.display = 'block';
            grid.innerHTML = `
                <div class="empty-box">
                    <div class="icon">⭐</div>
                    <p>아직 즐겨찾기에 추가된 항목이 없습니다.</p>
                    <p class="sub">메인 화면 TMDB 카드의 ★ 버튼이나, 상세 페이지의 '즐겨찾기 추가' 버튼을 눌러보세요.</p>
                    <br>
                    <a href="index.html" class="btn">🎬 전체 영화 보러가기</a>
                </div>
            `;
            return;
        }

        grid.style.display = 'grid';
        grid.innerHTML = '';

        bookmarks.forEach(m => {
            const dateStr = m.createdAt ? new Date(m.createdAt).toLocaleDateString('ko-KR') : (m.date || '-');
            const card = document.createElement('div');
            card.className = 'fav-card';
            card.onclick = () => { window.location.href = `detail.html?id=${m.id}`; };

            const posterHtml = m.poster
                ? `<img class="fav-poster" src="${m.poster}" alt="${m.title}" onerror="this.replaceWith(Object.assign(document.createElement('div'), {className:'fav-poster-fallback', innerText:'🎬'}))">`
                : `<div class="fav-poster-fallback">🎬</div>`;

            const metaRight = m.isTmdb && m.vote
                ? `<span class="fav-vote">★ ${Number(m.vote).toFixed(1)}</span>`
                : `<span>📅 ${dateStr}</span>`;

            card.innerHTML = `
                <button class="remove-btn" title="즐겨찾기 해제">★</button>
                ${posterHtml}
                <div class="fav-body">
                    <div class="fav-title-row">
                        <span class="fav-title">${m.title}</span>
                        <span class="genre-badge">${m.genre || '기타'}</span>
                    </div>
                    <div class="fav-meta">
                        <span>✍️ ${m.writer || '익명'}</span>
                        ${metaRight}
                    </div>
                </div>
            `;

            card.querySelector('.remove-btn').addEventListener('click', (e) => removeBookmark(e, m.id));
            grid.appendChild(card);
        });
    }

    window.onload = () => {
        updateAdminBtn();
        renderFavorites();
    };
</script>
</body>
</html>
