<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시네마 로그 - 메인페이지</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-color: #6c5ce7;
            --accent-hover: #5b4bc4;
            --border-color: #334155;
            --danger-color: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Pretendard', sans-serif; background-color: var(--bg-color); color: var(--text-main); padding-bottom: 50px; }

        .navbar { background-color: var(--card-bg); display: flex; align-items: center; justify-content: space-between; padding: 15px 40px; border-bottom: 1px solid var(--border-color); }
        .nav-left { display: flex; align-items: center; gap: 30px; }
        .navbar-brand { font-size: 20px; font-weight: bold; color: var(--text-main); text-decoration: none; }
        .nav-menu { list-style: none; display: flex; gap: 20px; align-items: center; }
        .nav-menu a { color: var(--text-sub); text-decoration: none; font-weight: bold; transition: 0.2s; }
        .nav-menu a:hover, .nav-menu a.active { color: var(--accent-color); }

        .admin-btn { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border-color); background: #0f172a; color: var(--text-sub); cursor: pointer; font-size: 13px; font-weight: bold; }
        .admin-btn.active { background: var(--accent-color); color: white; border-color: var(--accent-color); }

        .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        .hero-banner { background: linear-gradient(135deg, #1e293b, #0f172a); border: 1px solid var(--border-color); border-left: 5px solid var(--accent-color); padding: 30px; border-radius: 12px; margin-bottom: 30px; }
        .hero-banner h1 { color: var(--text-main); margin-bottom: 10px; font-size: 26px; }
        .hero-banner p { color: var(--text-sub); font-size: 15px; }

        .api-section { margin-bottom: 40px; background: rgba(30, 41, 59, 0.4); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); }
        .api-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; }
        .api-header h2 { font-size: 20px; color: var(--text-main); display: flex; align-items: center; gap: 8px; }
        
        .api-search-box { display: flex; gap: 8px; }
        .api-search-box input { padding: 8px 12px; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-main); outline: none; font-size: 14px; }
        .api-search-box input:focus { border-color: var(--accent-color); }
        .api-search-box button { padding: 8px 14px; background: var(--accent-color); border: none; color: white; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .api-search-box button:hover { background-color: var(--accent-hover); }

        .api-movie-list { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 15px; scrollbar-width: thin; scrollbar-color: var(--accent-color) var(--card-bg); }
        .api-movie-card { min-width: 150px; max-width: 150px; background: var(--card-bg); border-radius: 8px; overflow: hidden; border: 1px solid var(--border-color); cursor: pointer; transition: transform 0.2s, border-color 0.2s; flex-shrink: 0; }
        .api-movie-card:hover { transform: translateY(-5px); border-color: var(--accent-color); }
        .api-movie-card img { width: 100%; height: 210px; object-fit: cover; background: #0f172a; display: block; }
        .api-movie-info { padding: 10px; }
        .api-movie-title { font-size: 13px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-main); }
        .api-movie-vote { font-size: 12px; color: #f1c40f; margin-top: 4px; font-weight: bold; }

        .search-box { margin-bottom: 30px; display: flex; gap: 10px; }
        .search-box select, .search-box input { padding: 12px 16px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); outline: none; font-size: 15px; }
        .search-box input { flex: 1; }
        .search-box select:focus, .search-box input:focus { border-color: var(--accent-color); }
        
        .btn { padding: 12px 20px; background-color: var(--accent-color); color: white; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s; }
        .btn:hover { background-color: var(--accent-hover); }

        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        
        .movie-card { 
            background-color: var(--card-bg); 
            border: 1px solid var(--border-color); 
            border-radius: 12px; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            transition: transform 0.2s, border-color 0.2s; 
            position: relative; 
            cursor: pointer; 
        }
        .movie-card.hidden-card { opacity: 0.6; border-style: dashed; }
        .movie-card:hover { transform: translateY(-5px); border-color: var(--accent-color); }

        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
        .card-title { font-size: 18px; font-weight: bold; color: var(--text-main); text-decoration: none; }
        .genre-badge { background: #0f172a; border: 1px solid var(--border-color); color: var(--accent-color); font-size: 12px; padding: 3px 8px; border-radius: 12px; font-weight: bold; }
        .card-info { font-size: 13px; color: var(--text-sub); margin-bottom: 10px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 5px; }
        .card-content { font-size: 14px; color: var(--text-sub); margin-bottom: 15px; display: -webkit-box; line-clamp: 2; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; line-height: 1.5; }
        .card-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color); padding-top: 12px; font-size: 13px; color: var(--text-sub); }
        .empty-msg { grid-column: 1 / -1; text-align: center; color: var(--text-sub); padding: 50px 0; }
        .hidden-badge { color: var(--danger-color); font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="nav-left">
        <a href="index.html" class="navbar-brand">🎬 시네마 로그</a>
        <ul class="nav-menu">
            <li><a href="index.html" class="active">메인</a></li>
            <li><a href="about.html">사이트 소개</a></li>
            <li><a href="#" id="recentDetailNav">상세 페이지</a></li>
            <li><a href="addForm.html">+ 감상평 등록</a></li>
        </ul>
    </div>
    <div>
        <button id="adminToggleBtn" class="admin-btn" onclick="toggleAdmin()">🔒 관리자 로그인</button>
    </div>
</nav>

<div class="container">
    <div class="hero-banner">
        <h1>나만의 영화 감상 기록 공간</h1>
        <p>장르별 검색, 추천 기능 및 자유로운 감상평 다크 갤러리</p>
    </div>

    <div class="api-section">
        <div class="api-header">
            <h2 id="apiSectionTitle">🔥 실시간 인기 트렌드 영화 (클릭 시 상세 정보 보기)</h2>
            <div class="api-search-box">
                <input type="text" id="apiSearchInput" placeholder="영화 제목 검색..." onkeyup="if(event.key==='Enter') searchApiMovies()">
                <button type="button" onclick="searchApiMovies()">검색</button>
                <button type="button" onclick="fetchApiMovies()" style="background:#334155;">인기순</button>
            </div>
        </div>
        <div class="api-movie-list" id="apiMovieList">
            <div style="color:var(--text-sub); font-size:14px;">영화 데이터 불러오는 중...</div>
        </div>
    </div>
    
    <h2 style="margin-bottom: 15px; font-size: 20px;">📝 등록된 영화 감상평 목록</h2>
    <div class="search-box">
        <select id="genreSelect" onchange="renderList()">
            <option value="">전체 장르</option>
            <option value="액션">액션</option>
            <option value="드라마">드라마</option>
            <option value="코미디">코미디</option>
            <option value="SF/판타지">SF/판타지</option>
            <option value="스릴러/공포">스릴러/공포</option>
            <option value="기타">기타</option>
        </select>
        <input type="text" id="searchInput" placeholder="영화 제목으로 검색..." onkeyup="renderList()">
        <button type="button" class="btn" onclick="renderList()">검색</button>
    </div>

    <div class="grid-container" id="movieGrid"></div>
</div>

<script>
    function checkAdmin() {
        return localStorage.getItem('isAdmin') === 'true';
    }

    function updateAdminBtn() {
        const btn = document.getElementById('adminToggleBtn');
        if (checkAdmin()) {
            btn.innerText = "🔓 관리자 로그아웃";
            btn.classList.add('active');
        } else {
            btn.innerText = "🔒 관리자 로그인";
            btn.classList.remove('active');
        }
    }

    async function toggleAdmin() {
        if (checkAdmin()) {
            localStorage.setItem('isAdmin', 'false');
            alert('관리자 모드에서 로그아웃했습니다.');
            updateAdminBtn();
            renderList();
        } else {
            const inputId = prompt("관리자 아이디를 입력하세요:");
            if (inputId === null) return;
            const inputPw = prompt("관리자 비밀번호를 입력하세요:");
            if (inputPw === null) return;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: inputId.trim(), password: inputPw.trim() })
                });
                const result = await response.json();

                if (response.ok && result.success) {
                    localStorage.setItem('isAdmin', 'true');
                    alert('관리자 로그인에 성공했습니다!');
                    updateAdminBtn();
                    renderList();
                } else {
                    alert(result.message || '로그인에 실패했습니다.');
                    localStorage.setItem('isAdmin', 'false');
                }
            } catch (error) {
                console.error('로그인 요청 오류:', error);
                alert('서버 통신 실패. server.js 상태를 확인하세요.');
            }
        }
    }

    const TMDB_API_KEY = 'f97987814400762f02f8373b5a1b32d2';

    async function fetchApiMovies() {
        const titleElem = document.getElementById('apiSectionTitle');
        if (titleElem) titleElem.innerText = "🔥 실시간 인기 트렌드 영화 (클릭 시 상세 정보 보기)";
        const url = `https://api.themoviedb.org/3/movie/popular?api_key=${TMDB_API_KEY}&language=ko-KR&page=1`;
        await renderApiMovies(url);
    }

    async function searchApiMovies() {
        const inputElem = document.getElementById('apiSearchInput');
        const query = inputElem ? inputElem.value.trim() : '';
        if (!query) {
            alert('검색할 영화 제목을 입력해주세요!');
            return;
        }
        const titleElem = document.getElementById('apiSectionTitle');
        if (titleElem) titleElem.innerText = `🔍 '${query}' 실시간 검색 결과 (클릭 시 상세 정보 보기)`;
        const url = `https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&language=ko-KR&query=${encodeURIComponent(query)}&page=1`;
        await renderApiMovies(url);
    }

    async function renderApiMovies(url) {
        const apiContainer = document.getElementById('apiMovieList');
        if (!apiContainer) return;

        apiContainer.innerHTML = '<div style="color:var(--text-sub); font-size:14px; padding:10px;">⚡ 영화 데이터를 실시간으로 가져오는 중입니다...</div>';

        try {
            const res = await fetch(url);
            if (!res.ok) throw new Error(`API 통신 실패`);

            const data = await res.json();
            apiContainer.innerHTML = '';
            
            if (data.results && data.results.length > 0) {
                data.results.forEach(movie => {
                    const card = document.createElement('div');
                    card.className = 'api-movie-card';
                    
                    // TMDB 고화질 포스터 사용
                    const posterUrl = movie.poster_path 
                        ? `https://image.tmdb.org/t/p/w500${movie.poster_path}` 
                        : '';

                    const voteAvg = movie.vote_average ? movie.vote_average.toFixed(1) : '0.0';

                    card.innerHTML = `
                        <img src="${posterUrl}" alt="${movie.title}" 
                             onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=300';">
                        <div class="api-movie-info">
                            <div class="api-movie-title" title="${movie.title}">${movie.title}</div>
                            <div class="api-movie-vote">★ ${voteAvg}</div>
                        </div>
                    `;

                    card.onclick = () => {
                        window.location.href = `detail.html?movieId=${movie.id}&title=${encodeURIComponent(movie.title)}`;
                    };

                    apiContainer.appendChild(card);
                });
            } else {
                renderBackupMovies(apiContainer);
            }
        } catch (err) {
            console.error("API 연동 오류, 백업 포스터 데이터로 자동 전환:", err);
            renderBackupMovies(apiContainer);
        }
    }

    // 외부 네트워크 통신 실패 시도 견디는 고화질 고정 포스터 데이터
    function renderBackupMovies(container) {
        const fallbackMovies = [
            { 
                id: 1022789, 
                title: "인사이드 아웃 2", 
                vote: "8.5", 
                img: "https://image.tmdb.org/t/p/w500/vpn259A8I4o92C1W0Y6171a48c5.jpg" 
            },
            { 
                id: 934632, 
                title: "파묘", 
                vote: "8.2", 
                img: "https://image.tmdb.org/t/p/w500/pI2449I94a11b6yI2a8i80y4c40.jpg" 
            },
            { 
                id: 1011985, 
                title: "범죄도시 4", 
                vote: "7.8", 
                img: "https://image.tmdb.org/t/p/w500/4G1s331I90c1G95bC0Yc1a01121.jpg" 
            },
            { 
                id: 76600, 
                title: "아바타: 물의 길", 
                vote: "8.8", 
                img: "https://image.tmdb.org/t/p/w500/t6HIfvG8S2Z9v35p33wY8a6C5a8.jpg" 
            }
        ];

        container.innerHTML = '';
        fallbackMovies.forEach(movie => {
            const card = document.createElement('div');
            card.className = 'api-movie-card';
            card.innerHTML = `
                <img src="${movie.img}" alt="${movie.title}" 
                     onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=300';">
                <div class="api-movie-info">
                    <div class="api-movie-title">${movie.title}</div>
                    <div class="api-movie-vote">★ ${movie.vote}</div>
                </div>
            `;
            card.onclick = () => {
                window.location.href = `detail.html?movieId=${movie.id}&title=${encodeURIComponent(movie.title)}`;
            };
            container.appendChild(card);
        });
    }

    async function initDetailMenu() {
        const isAdmin = checkAdmin();
        const detailNav = document.getElementById('recentDetailNav');
        try {
            const res = await fetch(`/api/movies?isAdmin=${isAdmin}`);
            const movies = await res.json();
            if (movies && movies.length > 0) {
                movies.sort((a, b) => b.id - a.id);
                detailNav.href = `detail.html?id=${movies[0].id}`;
            } else {
                detailNav.onclick = (e) => {
                    e.preventDefault();
                    alert('등록된 영화 감상평이 없습니다.');
                };
            }
        } catch (err) {
            console.error('메뉴 로드 실패:', err);
        }
    }

    async function renderList() {
        const keyword = document.getElementById('searchInput').value;
        const genre = document.getElementById('genreSelect').value;
        const isAdmin = checkAdmin();
        const grid = document.getElementById('movieGrid');

        try {
            const response = await fetch(`/api/movies?search=${encodeURIComponent(keyword)}&genre=${encodeURIComponent(genre)}&isAdmin=${isAdmin}`);
            let movies = await response.json();
            grid.innerHTML = '';
            
            if (movies.length === 0) {
                grid.innerHTML = '<div class="empty-msg">등록된 영화 감상평이 없습니다.</div>';
                return;
            }

            movies.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));

            movies.forEach((m) => {
                const card = document.createElement('div');
                card.className = `movie-card ${m.isHidden ? 'hidden-card' : ''}`;
                
                card.onclick = () => {
                    window.location.href = `detail.html?id=${m.id}`;
                };

                const dateStr = m.createdAt 
                    ? new Date(m.createdAt).toLocaleDateString('ko-KR') 
                    : (m.date || '2026. 08. 04');

                card.innerHTML = `
                    <div>
                        <div class="card-header">
                            <span class="card-title">${m.title}</span>
                            <span class="genre-badge">${m.genre || '기타'}</span>
                        </div>
                        <div class="card-info">
                            <span>✍️ ${m.writer} ${m.isHidden ? '<span class="hidden-badge">[숨김]</span>' : ''}</span>
                            <span>📅 ${dateStr}</span>
                        </div>
                        <div class="card-content">${m.content || '등록된 감상평이 없습니다.'}</div>
                    </div>
                    <div class="card-footer">
                        <span>👁️ ${m.views}회 | 👍 ${m.likes || 0}</span>
                        <span style="color:var(--accent-color); font-weight:bold;">감상평 읽기 &rarr;</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        } catch (error) {
            console.error("데이터 로드 실패:", error);
        }
    }

    window.onload = () => {
        updateAdminBtn();
        fetchApiMovies();
        renderList();
        initDetailMenu();
    };
</script>
</body>
</html>
