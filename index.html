<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>시네마 로그 - 메인페이지</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #f4f6f9; margin: 0; padding-bottom: 40px; }
        .navbar { background-color: #3b3b98; display: flex; align-items: center; padding: 0 40px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .nav-left { display: flex; align-items: center; gap: 30px; }
        .navbar-brand { font-size: 20px; font-weight: bold; color: white; text-decoration: none; padding: 15px 0; }
        .nav-menu { list-style: none; display: flex; gap: 20px; margin: 0; padding: 0; align-items: center; }
        .nav-menu a { color: #dcdde1; text-decoration: none; font-size: 15px; font-weight: bold; transition: 0.2s; }
        .nav-menu a:hover, .nav-menu a.active { color: #ffffff; text-decoration: underline; }
        .container { max-width: 850px; margin: 30px auto; background: white; padding: 35px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .hero-banner { background: #eef2f7; padding: 25px; border-radius: 8px; margin-bottom: 25px; border-left: 5px solid #3b3b98; }
        .hero-banner h1 { margin: 0 0 10px 0; color: #2c3e50; font-size: 24px; }
        .hero-banner p { margin: 0; color: #666; font-size: 14px; }
        .btn { padding: 9px 16px; background-color: #3b3b98; color: white; text-decoration: none; border-radius: 6px; border: none; cursor: pointer; font-size: 14px; display: inline-block; }
        .btn:hover { background-color: #2e2e78; }
        .search-box { margin-bottom: 20px; display: flex; gap: 8px; }
        .search-box input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 6px; outline: none; font-size: 14px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border-bottom: 1px solid #eee; padding: 12px 10px; text-align: left; }
        th { background-color: #f8f9fc; color: #444; font-weight: bold; }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="nav-left">
        <a href="index.html" class="navbar-brand">🎬 시네마 로그</a>
        <ul class="nav-menu">
            <li><a href="index.html" class="active">메인</a></li>
            <li><a href="about.html">사이트 소개</a></li>
            <li><a href="addForm.html">+ 감상평 등록</a></li>
        </ul>
    </div>
</nav>
<div class="container">
    <div class="hero-banner">
        <h1>나만의 영화 감상 기록 공간</h1>
        <p>인상 깊게 본 영화의 후기와 장르를 기록하고 언제든지 검색해 보세요.</p>
    </div>
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="찾고 싶은 영화 제목을 입력하세요..." onkeyup="renderList()">
        <button type="button" class="btn" onclick="renderList()">검색</button>
    </div>
    <table>
        <thead>
            <tr>
                <th style="width: 10%;">번호</th>
                <th style="width: 45%;">영화 제목</th>
                <th style="width: 20%;">기록자</th>
                <th style="width: 12%;">조회수</th>
                <th style="width: 13%;">관리</th>
            </tr>
        </thead>
        <tbody id="movieTableBody"></tbody>
    </table>
</div>
<script>
    async function renderList() {
        const keyword = document.getElementById('searchInput').value;
        const tbody = document.getElementById('movieTableBody');
        try {
            const response = await fetch(`/api/movies?search=${encodeURIComponent(keyword)}`);
            const movies = await response.json();
            tbody.innerHTML = '';
            if (movies.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#888; padding:30px 0;">등록된 감상평이 없습니다.</td></tr>';
                return;
            }
            movies.forEach((m, idx) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${movies.length - idx}</td>
                    <td><a href="detail.html?id=${m.id}" style="color:#2c3e50; font-weight:bold; text-decoration:none;">${m.title}</a></td>
                    <td>${m.writer}</td>
                    <td>${m.views}</td>
                    <td><a href="editForm.html?id=${m.id}" style="color:#3b3b98; text-decoration:none;">수정</a></td>
                `;
                tbody.appendChild(tr);
            });
        } catch (error) {
            console.error("데이터 로드 실패:", error);
        }
    }
    window.onload = renderList;
</script>
</body>
</html>
