<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시네마 로그 - 메인페이지</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-color: #6c5ce7;
            --accent-hover: #5b4bc4;
            --border-color: #334155;
            --danger-color: #ef4444;
            --danger-hover: #dc2626;
            --warning-color: #f59e0b;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            -webkit-user-select: none; 
            -moz-user-select: none; 
            -ms-user-select: none; 
            user-select: none; 
        }

        body { font-family: 'Pretendard', sans-serif; background-color: var(--bg-color); color: var(--text-main); padding-bottom: 50px; }

        .navbar { background-color: var(--card-bg); display: flex; align-items: center; justify-content: space-between; padding: 15px 40px; border-bottom: 1px solid var(--border-color); }
        .nav-left { display: flex; align-items: center; gap: 30px; }
        .navbar-brand { font-size: 20px; font-weight: bold; color: var(--text-main); text-decoration: none; }
        .nav-menu { list-style: none; display: flex; gap: 20px; align-items: center; }
        .nav-menu a { color: var(--text-sub); text-decoration: none; font-weight: bold; transition: 0.2s; }
        .nav-menu a:hover, .nav-menu a.active { color: var(--accent-color); }

        .admin-btn { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border-color); background: #0f172a; color: var(--text-sub); cursor: pointer; font-size: 13px; font-weight: bold; }
        .admin-btn.active { background: var(--accent-color); color: white; border-color: var(--accent-color); }

        .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        .hero-banner { background: linear-gradient(135deg, #1e293b, #0f172a); border: 1px solid var(--border-color); border-left: 5px solid var(--accent-color); padding: 30px; border-radius: 12px; margin-bottom: 30px; }
        .hero-banner h1 { color: var(--text-main); margin-bottom: 10px; font-size: 26px; }
        .hero-banner p { color: var(--text-sub); font-size: 15px; }

        .api-section { margin-bottom: 40px; background: rgba(30, 41, 59, 0.4); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); }
        .api-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; }
        .api-header h2 { font-size: 20px; color: var(--text-main); display: flex; align-items: center; gap: 8px; }
        
        .api-search-box { display: flex; gap: 8px; }
        .api-search-box input { padding: 8px 12px; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-main); outline: none; font-size: 14px; }
        .api-search-box input:focus { border-color: var(--accent-color); }
        .api-search-box button { padding: 8px 14px; background: var(--accent-color); border: none; color: white; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .api-search-box button:hover { background-color: var(--accent-hover); }

        .api-movie-list { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 15px; min-height: 270px; scrollbar-width: thin; scrollbar-color: var(--accent-color) var(--card-bg); }
        .api-movie-card { min-width: 150px; max-width: 150px; background: var(--card-bg); border-radius: 8px; overflow: hidden; border: 1px solid var(--border-color); cursor: pointer; transition: transform 0.2s, border-color 0.2s; flex-shrink: 0; position: relative; }
        .api-movie-card:hover { transform: translateY(-5px); border-color: var(--accent-color); }
        .api-movie-card img { width: 100%; height: 210px; object-fit: cover; background: #0f172a; display: block; }
        .api-movie-info { padding: 10px; }
        .api-movie-title { font-size: 13px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-main); }
        .api-movie-vote { font-size: 12px; color: #f1c40f; margin-top: 4px; font-weight: bold; }

        /* 즐겨찾기 북마크 버튼 */
        .bookmark-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(15, 23, 42, 0.7);
            border: none;
            color: #f1c40f;
            font-size: 16px;
            padding: 4px 6px;
            border-radius: 50%;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }
        .bookmark-btn:hover { transform: scale(1.1); }

        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .btn-danger { padding: 8px 14px; background-color: var(--danger-color); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .btn-danger:hover { background-color: var(--danger-hover); }

        .search-box { margin-bottom: 30px; display: flex; gap: 10px; }
        .search-box select, .search-box input { padding: 12px 16px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); outline: none; font-size: 15px; }
        .search-box input { flex: 1; }
        .search-box select:focus, .search-box input:focus { border-color: var(--accent-color); }
        
        .btn { padding: 12px 20px; background-color: var(--accent-color); color: white; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s; }
        .btn:hover { background-color: var(--accent-hover); }

        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        
        .movie-card { 
            background-color: var(--card-bg); 
            border: 1px solid var(--border-color); 
            border-radius: 12px; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            transition: transform 0.2s, border-color 0.2s; 
            position: relative; 
            cursor: pointer; 
            word-break: break-word; 
            overflow: hidden;
        }
        .movie-card.hidden-card { opacity: 0.55; border-style: dashed; border-color: var(--warning-color); }
        .movie-card:hover { transform: translateY(-5px); border-color: var(--accent-color); }

        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; gap: 10px; }
        .card-title { font-size: 18px; font-weight: bold; color: var(--text-main); text-decoration: none; word-break: break-word; }
        .genre-badge { background: #0f172a; border: 1px solid var(--border-color); color: var(--accent-color); font-size: 12px; padding: 3px 8px; border-radius: 12px; font-weight: bold; flex-shrink: 0; }
        .card-info { font-size: 13px; color: var(--text-sub); margin-bottom: 10px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 5px; word-break: break-word; }
        .card-content { font-size: 14px; color: var(--text-sub); margin-bottom: 15px; display: -webkit-box; line-clamp: 2; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; line-height: 1.5; word-break: break-word; }
        .card-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color); padding-top: 12px; font-size: 13px; color: var(--text-sub); }
        .empty-msg { grid-column: 1 / -1; text-align: center; color: var(--text-sub); padding: 50px 0; }
        
        .admin-action-btn {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            font-weight: bold;
            margin-left: 4px;
        }
        .admin-action-btn:hover { background: var(--accent-color); }
        .btn-hide-card { color: var(--warning-color); border-color: var(--warning-color); }
        .btn-delete-card { color: var(--danger-color); border-color: var(--danger-color); }
        .hidden-badge { color: var(--warning-color); font-size: 12px; font-weight: bold; }

        .like-btn {
            background: rgba(108, 92, 231, 0.15);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 2px 8px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: 0.2s;
        }
        .like-btn:hover { background: var(--accent-color); color: white; }
    </style>
</head>
<body oncontextmenu="return false" onselectstart="return false" ondragstart="return false">

<nav class="navbar">
    <div class="nav-left">
        <a href="index.html" class="navbar-brand">🎬 시네마 로그</a>
        <ul class="nav-menu">
            <li><a href="index.html" class="active">메인</a></li>
            <li><a href="about.html">사이트 소개</a></li>
            <li><a href="detail.html" id="recentDetailNav">상세 페이지</a></li>
            <li><a href="favorites.html">⭐ 즐겨찾기</a></li>
            <li><a href="addForm.html">+ 감상평 등록</a></li>
        </ul>
    </div>
    <div>
        <button id="adminToggleBtn" class="admin-btn" onclick="toggleAdmin()">🔒 관리자 로그인</button>
    </div>
</nav>

<div class="container">
    <div class="hero-banner">
        <h1>나만의 영화 감상 기록 공간</h1>
        <p>장르별 검색, TMDB 실시간 무비 정보 및 자유로운 감상평 다크 갤러리</p>
    </div>

    <!-- TMDB API 가동 영역 (즐겨찾기 중복 방지 + 포스터/평점 저장) -->
    <div class="api-section">
        <div class="api-header">
            <h2 id="apiSectionTitle">🔥 실시간 인기 트렌드 영화</h2>
            <div class="api-search-box">
                <input type="text" id="apiSearchInput" placeholder="영화 제목 검색..." onkeyup="if(event.key==='Enter') searchApiMovies()">
                <button type="button" onclick="searchApiMovies()">검색</button>
                <button type="button" onclick="fetchApiMovies()" style="background:#334155;">인기순</button>
            </div>
        </div>
        <div class="api-movie-list" id="apiMovieList"></div>
    </div>
    
    <div class="section-header">
        <h2 style="font-size: 20px;">📝 등록된 영화 감상평 목록</h2>
        <button id="deleteAllBtn" class="btn-danger" style="display:none;" onclick="deleteAllMovies()">🗑️ 감상평 전체 삭제</button>
    </div>

    <div class="search-box">
        <select id="genreSelect" onchange="renderList()">
            <option value="">전체 장르</option>
            <option value="액션">액션</option>
            <option value="드라마">드라마</option>
            <option value="코미디">코미디</option>
            <option value="SF/판타지">SF/판타지</option>
            <option value="스릴러/공포">스릴러/공포</option>
            <option value="기타">기타</option>
        </select>
        <input type="text" id="searchInput" placeholder="영화 제목으로 감상평 검색..." onkeyup="renderList()">
        <button type="button" class="btn" onclick="renderList()">검색</button>
    </div>

    <div class="grid-container" id="movieGrid"></div>
</div>

<script>
    const DIRECT_TMDB_KEY = '0de30fcff153e1d01942f9fe2e563d0b';

    // 보안 단축키 차단
    document.addEventListener('keydown', function(e) {
        if (e.keyCode === 123) { e.preventDefault(); return false; }
        if (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) { e.preventDefault(); return false; }
        if (e.ctrlKey && e.keyCode === 85) { e.preventDefault(); return false; }
        if (e.ctrlKey && e.keyCode === 83) { e.preventDefault(); return false; }
    });

    function checkAdmin() {
        return localStorage.getItem('isAdmin') === 'true';
    }

    function updateAdminBtn() {
        const btn = document.getElementById('adminToggleBtn');
        const deleteAllBtn = document.getElementById('deleteAllBtn');
        
        if (checkAdmin()) {
            btn.innerText = "🔓 관리자 로그아웃";
            btn.classList.add('active');
            if (deleteAllBtn) deleteAllBtn.style.display = 'inline-block';
        } else {
            btn.innerText = "🔒 관리자 로그인";
            btn.classList.remove('active');
            if (deleteAllBtn) deleteAllBtn.style.display = 'none';
        }
    }

    async function toggleAdmin() {
        if (checkAdmin()) {
            localStorage.setItem('isAdmin', 'false');
            alert('관리자 모드에서 로그아웃했습니다.');
            updateAdminBtn();
            renderList();
        } else {
            const inputId = prompt("관리자 아이디를 입력하세요:");
            if (inputId === null) return;
            const inputPw = prompt("관리자 비밀번호를 입력하세요:");
            if (inputPw === null) return;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: inputId.trim(), password: inputPw.trim() })
                });

                if (res.ok) {
                    localStorage.setItem('isAdmin', 'true');
                    alert('관리자 로그인 성공!');
                    updateAdminBtn();
                    renderList();
                } else {
                    alert('아이디 또는 비밀번호가 올바르지 않습니다.');
                }
            } catch (err) {
                alert('서버 응답 오류가 발생했습니다.');
            }
        }
    }

    // 🌐 백엔드 우선 조회
    async function fetchApiMovies() {
        const container = document.getElementById('apiMovieList');
        document.getElementById('apiSectionTitle').innerText = '🔥 실시간 인기 트렌드 영화';
        container.innerHTML = '<div style="color:var(--text-sub); padding:10px;">영화 목록을 불러오는 중...</div>';

        try {
            const res = await fetch('/api/tmdb/popular');
            if (!res.ok) throw new Error('서버 API 에러');
            const data = await res.json();
            renderApiMovies(data.results || []);
        } catch (err) {
            try {
                const directUrl = `https://api.themoviedb.org/3/movie/popular?api_key=${DIRECT_TMDB_KEY}&language=ko-KR&page=1`;
                const directRes = await fetch(directUrl);
                const directData = await directRes.json();
                renderApiMovies(directData.results || []);
            } catch (directErr) {
                container.innerHTML = '<div style="color:var(--text-sub); padding:10px;">TMDB 영화 목록을 불러올 수 없습니다.</div>';
            }
        }
    }

    // 🌐 TMDB 영화 검색
    async function searchApiMovies() {
        const query = document.getElementById('apiSearchInput').value.trim();
        if (!query) {
            alert('검색어를 입력해 주세요.');
            return;
        }

        const container = document.getElementById('apiMovieList');
        document.getElementById('apiSectionTitle').innerText = `🔍 TMDB 검색 결과: "${query}"`;
        container.innerHTML = '<div style="color:var(--text-sub); padding:10px;">검색 중...</div>';

        try {
            const res = await fetch(`/api/tmdb/search?query=${encodeURIComponent(query)}`);
            if (!res.ok) throw new Error('서버 검색 에러');
            const data = await res.json();
            renderApiMovies(data.results || []);
        } catch (err) {
            try {
                const directUrl = `https://api.themoviedb.org/3/search/movie?api_key=${DIRECT_TMDB_KEY}&language=ko-KR&query=${encodeURIComponent(query)}&page=1`;
                const directRes = await fetch(directUrl);
                const directData = await directRes.json();
                renderApiMovies(directData.results || []);
            } catch (directErr) {
                container.innerHTML = '<div style="color:var(--text-sub); padding:10px;">검색에 실패했습니다.</div>';
            }
        }
    }

    // ✅ TMDB 트렌드 영역 렌더링 (즐겨찾기 버튼에 실제 영화 객체를 클로저로 연결)
    function renderApiMovies(movies) {
        const container = document.getElementById('apiMovieList');
        container.innerHTML = '';

        if (!movies || movies.length === 0) {
            container.innerHTML = '<div style="color:var(--text-sub); padding:10px;">검색 결과가 없습니다.</div>';
            return;
        }

        const fallbackImg = 'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=300';

        movies.forEach(movie => {
            const card = document.createElement('div');
            card.className = 'api-movie-card';
            
            const posterUrl = movie.poster_path 
                ? `https://image.tmdb.org/t/p/w500${movie.poster_path}`
                : fallbackImg;

            card.innerHTML = `
                <button class="bookmark-btn" title="즐겨찾기 추가">★</button>
                <img src="${posterUrl}" alt="${movie.title}" onerror="this.onerror=null; this.src='${fallbackImg}';">
                <div class="api-movie-info">
                    <div class="api-movie-title" title="${movie.title}">${movie.title}</div>
                    <div class="api-movie-vote">★ ${movie.vote_average ? movie.vote_average.toFixed(1) : 'N/A'}</div>
                </div>
            `;

            // 북마크 버튼: 영화 전체 정보를 클로저로 전달 (제목에 따옴표가 있어도 안전)
            const bookmarkBtn = card.querySelector('.bookmark-btn');
            bookmarkBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                addBookmark(movie, movie.poster_path ? posterUrl : null);
            });
            
            card.onclick = (e) => {
                if (e.target.classList.contains('bookmark-btn')) return;
                if (confirm(`'${movie.title}' 영화 감상평을 작성하시겠습니까?`)) {
                    window.location.href = `addForm.html?title=${encodeURIComponent(movie.title)}`;
                }
            };
            container.appendChild(card);
        });
    }

    // ✅ 즐겨찾기 저장 (중복 방지 + 포스터/장르/평점까지 함께 저장)
    function addBookmark(movie, posterUrl) {
        let bookmarks = JSON.parse(localStorage.getItem('myBookmarks') || '[]');
        
        // 중복 저장 검사
        const isExist = bookmarks.some(b => b.id === movie.id);
        if (isExist) {
            alert(`'${movie.title}' 영화는 이미 즐겨찾기에 등록되어 있습니다.`);
            return;
        }

        bookmarks.push({
            id: movie.id,
            title: movie.title,
            genre: 'TMDB',
            writer: 'TMDB 공식 정보',
            content: movie.overview || '',
            poster: posterUrl,
            vote: movie.vote_average || null,
            isTmdb: true,
            createdAt: new Date().toISOString()
        });
        localStorage.setItem('myBookmarks', JSON.stringify(bookmarks));
        alert(`'${movie.title}' 영화가 즐겨찾기에 등록되었습니다!`);
    }

    // ✅ DB 감상평 목록 렌더링 (서버 API 우선 호출 & detail.html?id=번호 이동)
    async function renderList() {
        const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
        const genre = document.getElementById('genreSelect').value;
        const isAdmin = checkAdmin();
        const grid = document.getElementById('movieGrid');

        let movies = [];

        // 1. 서버 API를 우선 조회
        try {
            const response = await fetch(`/api/movies?search=${encodeURIComponent(keyword)}&genre=${encodeURIComponent(genre)}&isAdmin=${isAdmin}`);
            if (response.ok) {
                movies = await response.json();
            } else {
                throw new Error('서버 호출 불가');
            }
        } catch (error) {
            // 2. 서버 연결 실패 시에만 로컬스토리지 보완
            movies = JSON.parse(localStorage.getItem('myMovies') || '[]');
            if (keyword) {
                movies = movies.filter(m => m.title && m.title.toLowerCase().includes(keyword));
            }
            if (genre) {
                movies = movies.filter(m => m.genre === genre);
            }
            if (!isAdmin) {
                movies = movies.filter(m => !m.isHidden);
            }
        }

        grid.innerHTML = '';
        
        if (!movies || movies.length === 0) {
            grid.innerHTML = '<div class="empty-msg">등록된 영화 감상평이 없습니다. 첫 리뷰를 작성해보세요!</div>';
            return;
        }

        // 최신 감상평 링크 매핑
        const navDetailBtn = document.getElementById('recentDetailNav');
        if (navDetailBtn && movies.length > 0) {
            navDetailBtn.href = `detail.html?id=${movies[0].id}`;
        }

        movies.forEach((m) => {
            const card = document.createElement('div');
            card.className = `movie-card ${m.isHidden ? 'hidden-card' : ''}`;
            
            // ✅ detail.html?id=번호 로 이동하도록 지정
            card.onclick = () => { window.location.href = `detail.html?id=${m.id}`; };

            // ✅ 날짜 기본값을 "-" 로 수정 (기존 고정 2026.08.04 제거)
            const dateStr = m.createdAt ? new Date(m.createdAt).toLocaleDateString('ko-KR') : '-';
            
            let adminBtnsHtml = '';
            if (isAdmin) {
                const hideText = m.isHidden ? '👁️ 노출' : '🙈 숨김';
                adminBtnsHtml = `
                    <button class="admin-action-btn btn-hide-card" onclick="toggleHideMovie(event, '${m.id}', ${!!m.isHidden})">${hideText}</button>
                    <button class="admin-action-btn btn-delete-card" onclick="deleteSingleMovie(event, '${m.id}')">🗑️ 삭제</button>
                `;
            }

            // ✅ DB 게시글 영역에만 좋아요 버튼 추가
            card.innerHTML = `
                <div>
                    <div class="card-header">
                        <span class="card-title">${m.title}</span>
                        <span class="genre-badge">${m.genre || '기타'}</span>
                    </div>
                    <div class="card-info">
                        <span>✍️ ${m.writer || '익명'} ${m.isHidden ? '<span class="hidden-badge">[숨겨짐]</span>' : ''} ${adminBtnsHtml}</span>
                        <span>📅 ${dateStr}</span>
                    </div>
                    <div class="card-content">${m.content || '등록된 감상평이 없습니다.'}</div>
                </div>
                <div class="card-footer">
                    <span>👁️ ${m.views || 0}회</span>
                    <div>
                        <button class="like-btn" onclick="likeMovie(event, '${m.id}')">👍 <span id="like-count-${m.id}">${m.likes || 0}</span></button>
                        <span style="color:var(--accent-color); font-weight:bold; margin-left: 8px;">감상평 읽기 &rarr;</span>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    // ✅ 게시글 좋아요 처리
    async function likeMovie(event, id) {
        event.stopPropagation();
        try {
            const res = await fetch(`/api/movies/${id}/like`, { method: 'POST' });
            if (res.ok) {
                const data = await res.json();
                const countElem = document.getElementById(`like-count-${id}`);
                if (countElem) countElem.innerText = data.likes;
            } else {
                likeLocalMovie(id);
            }
        } catch (err) {
            likeLocalMovie(id);
        }
    }

    function likeLocalMovie(id) {
        let localMovies = JSON.parse(localStorage.getItem('myMovies') || '[]');
        localMovies = localMovies.map(m => {
            if (m.id == id) {
                const likes = (m.likes || 0) + 1;
                const countElem = document.getElementById(`like-count-${id}`);
                if (countElem) countElem.innerText = likes;
                return { ...m, likes };
            }
            return m;
        });
        localStorage.setItem('myMovies', JSON.stringify(localMovies));
    }

    async function toggleHideMovie(event, id, currentStatus) {
        event.stopPropagation();
        try {
            const res = await fetch(`/api/movies/${id}/toggle-hide`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ isHidden: !currentStatus })
            });
            if (res.ok) {
                renderList();
            } else {
                toggleLocalHide(id, !currentStatus);
            }
        } catch (err) {
            toggleLocalHide(id, !currentStatus);
        }
    }

    function toggleLocalHide(id, newStatus) {
        let localMovies = JSON.parse(localStorage.getItem('myMovies') || '[]');
        localMovies = localMovies.map(m => m.id == id ? { ...m, isHidden: newStatus } : m);
        localStorage.setItem('myMovies', JSON.stringify(localMovies));
        renderList();
    }

    async function deleteSingleMovie(event, id) {
        event.stopPropagation();
        if (!confirm('정말로 이 감상평을 삭제하시겠습니까?')) return;

        try {
            const res = await fetch(`/api/movies/${id}`, { method: 'DELETE' });
            if (res.ok) {
                alert('감상평이 삭제되었습니다.');
                renderList();
            } else {
                deleteLocalMovie(id);
            }
        } catch (err) {
            deleteLocalMovie(id);
        }
    }

    function deleteLocalMovie(id) {
        let localMovies = JSON.parse(localStorage.getItem('myMovies') || '[]');
        localMovies = localMovies.filter(m => m.id != id);
        localStorage.setItem('myMovies', JSON.stringify(localMovies));
        alert('감상평이 삭제되었습니다.');
        renderList();
    }

    async function deleteAllMovies() {
        if (!confirm('⚠️ 경고: 등록된 전체 감상평을 모두 삭제하시겠습니까?\n이 작업은 복구할 수 없습니다.')) return;

        try {
            const res = await fetch('/api/movies', { method: 'DELETE' });
            if (res.ok) {
                alert('전체 감상평이 모두 삭제되었습니다.');
                renderList();
            } else {
                localStorage.removeItem('myMovies');
                alert('전체 감상평이 삭제되었습니다.');
                renderList();
            }
        } catch (err) {
            localStorage.removeItem('myMovies');
            alert('전체 감상평이 삭제되었습니다.');
            renderList();
        }
    }

    window.onload = () => {
         if (movieTitle) {
        document.getElementById("title").value = movieTitle;
    }

    if (!editId) return;
        updateAdminBtn();
        fetchApiMovies(); 
        renderList();
    };
</script>
</body>
</html>
