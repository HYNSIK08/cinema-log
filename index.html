<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시네마 로그 - 영화 감상평 아카이브</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-color: #6c5ce7;
            --accent-hover: #5b4bc4;
            --border-color: #334155;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
        }

        /* 🔒 드래그 및 선택 차단 */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            -webkit-user-select: none; 
            -moz-user-select: none; 
            -ms-user-select: none; 
            user-select: none; 
        }

        body { font-family: 'Pretendard', sans-serif; background-color: var(--bg-color); color: var(--text-main); padding-bottom: 50px; line-height: 1.6; }

        /* 네비게이션 바 */
        .navbar { background-color: var(--card-bg); display: flex; align-items: center; justify-content: space-between; padding: 15px 40px; border-bottom: 1px solid var(--border-color); }
        .nav-left { display: flex; align-items: center; gap: 30px; }
        .navbar-brand { font-size: 20px; font-weight: bold; color: var(--text-main); text-decoration: none; }
        .nav-menu { list-style: none; display: flex; gap: 20px; align-items: center; }
        .nav-menu a { color: var(--text-sub); text-decoration: none; font-weight: bold; transition: 0.2s; }
        .nav-menu a:hover, .nav-menu a.active { color: var(--accent-color); }

        .admin-btn { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border-color); background: #0f172a; color: var(--text-sub); cursor: pointer; font-size: 13px; font-weight: bold; }
        .admin-btn.active { background: var(--accent-color); color: white; border-color: var(--accent-color); }
        .btn-danger { background: var(--danger-color); color: white; border: none; }

        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }

        /* TMDB 슬라이더 및 카운트 섹션 */
        .tmdb-section { margin-bottom: 40px; }
        .section-title { font-size: 20px; font-weight: bold; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        .tmdb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; overflow-x: auto; padding-bottom: 10px; }
        .tmdb-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; cursor: pointer; transition: transform 0.2s; }
        .tmdb-card:hover { transform: translateY(-4px); }
        .tmdb-card img { width: 100%; height: 190px; object-fit: cover; }
        .tmdb-card-body { padding: 8px; font-size: 13px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }

        /* 필터 및 검색바 */
        .controls-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
        .filter-group { display: flex; gap: 8px; flex-wrap: wrap; }
        .filter-btn { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-sub); cursor: pointer; font-size: 13px; font-weight: bold; }
        .filter-btn.active { background: var(--accent-color); color: white; border-color: var(--accent-color); }

        .search-input { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-main); font-size: 14px; outline: none; width: 220px; }

        /* 카드 그리드 */
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .movie-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; position: relative; transition: transform 0.2s; }
        .movie-card:hover { transform: translateY(-4px); }
        .movie-card.hidden-card { opacity: 0.5; border: 1px dashed var(--warning-color); }

        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .card-title { font-size: 18px; font-weight: bold; color: var(--text-main); text-decoration: none; word-break: break-all; }
        .genre-badge { background: #0f172a; border: 1px solid var(--border-color); color: var(--accent-color); font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: bold; }

        .card-meta { font-size: 12px; color: var(--text-sub); margin-bottom: 10px; }
        .card-content { font-size: 14px; color: #cbd5e1; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 15px; word-break: break-all; }

        .card-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color); padding-top: 12px; font-size: 12px; color: var(--text-sub); }
        .card-actions { display: flex; gap: 6px; }
        .action-btn { padding: 4px 8px; border-radius: 4px; border: 1px solid var(--border-color); background: #0f172a; color: var(--text-sub); cursor: pointer; font-size: 11px; }

        .empty-box { text-align: center; padding: 50px 20px; color: var(--text-sub); background: var(--card-bg); border: 1px dashed var(--border-color); border-radius: 12px; grid-column: 1 / -1; }
    </style>
</head>
<body oncontextmenu="return false" onselectstart="return false" ondragstart="return false">

<!-- 네비게이션 바 -->
<nav class="navbar">
    <div class="nav-left">
        <a href="index.html" class="navbar-brand">🎬 시네마 로그</a>
        <ul class="nav-menu">
            <li><a href="index.html" class="active">메인</a></li>
            <li><a href="about.html">사이트 소개</a></li>
            <li><a href="detail.html">즐겨찾기 / 상세</a></li>
            <li><a href="addForm.html">+ 감상평 등록</a></li>
        </ul>
    </div>
    <div>
        <button id="adminToggleBtn" class="admin-btn" onclick="toggleAdmin()">🔒 관리자 로그인</button>
        <button id="changeAdminBtn" class="admin-btn" style="display:none; margin-left:6px;" onclick="changeAdminCredentials()">⚙️ 계정 변경</button>
        <button id="deleteAllBtn" class="admin-btn btn-danger" style="display:none; margin-left:6px;" onclick="deleteAllMovies()">🗑️ 전체 삭제</button>
    </div>
</nav>

<div class="container">
    <!-- TMDB 트렌딩 영화 -->
    <div class="tmdb-section">
        <h2 class="section-title">🔥 TMDB 실시간 인기 영화 (클릭 시 리뷰 작성)</h2>
        <div class="tmdb-grid" id="tmdbGrid">
            <div style="color:var(--text-sub); font-size:13px;">영화 목록을 불러오는 중...</div>
        </div>
    </div>

    <!-- 검색 및 필터 컨트롤 -->
    <div class="controls-row">
        <div class="filter-group" id="filterGroup">
            <button class="filter-btn active" onclick="setFilter('전체')">전체</button>
            <button class="filter-btn" onclick="setFilter('액션')">액션</button>
            <button class="filter-btn" onclick="setFilter('드라마')">드라마</button>
            <button class="filter-btn" onclick="setFilter('SF')">SF</button>
            <button class="filter-btn" onclick="setFilter('코미디')">코미디</button>
            <button class="filter-btn" onclick="setFilter('스릴러')">스릴러</button>
            <button class="filter-btn" onclick="setFilter('기타')">기타</button>
        </div>
        <input type="text" id="searchInput" class="search-input" placeholder="영화 제목 검색..." oninput="renderList()">
    </div>

    <!-- 영화 감상평 게시글 그리드 -->
    <div class="grid-container" id="movieGrid"></div>
</div>

<script>
    let currentFilter = '전체';
    let allMovies = [];

    // 🔒 키보드 보안 단축키 차단
    document.addEventListener('keydown', function(e) {
        if (e.keyCode === 123) { e.preventDefault(); return false; }
        if (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) { e.preventDefault(); return false; }
        if (e.ctrlKey && e.keyCode === 85) { e.preventDefault(); return false; }
        if (e.ctrlKey && e.keyCode === 83) { e.preventDefault(); return false; }
    });

    // 관리자 여부 체크
    function checkAdmin() {
        return localStorage.getItem('isAdmin') === 'true';
    }

    // 관리자 네비게이션 버튼 업데이트
    function updateAdminBtn() {
        const btn = document.getElementById('adminToggleBtn');
        const changeBtn = document.getElementById('changeAdminBtn');
        const deleteAllBtn = document.getElementById('deleteAllBtn');

        if (checkAdmin()) {
            btn.innerText = "🔓 관리자 로그아웃";
            btn.classList.add('active');
            if (changeBtn) changeBtn.style.display = 'inline-block';
            if (deleteAllBtn) deleteAllBtn.style.display = 'inline-block';
        } else {
            btn.innerText = "🔒 관리자 로그인";
            btn.classList.remove('active');
            if (changeBtn) changeBtn.style.display = 'none';
            if (deleteAllBtn) deleteAllBtn.style.display = 'none';
        }
    }

    // 관리자 로그인 토글
    async function toggleAdmin() {
        if (checkAdmin()) {
            localStorage.setItem('isAdmin', 'false');
            alert('관리자 모드에서 로그아웃했습니다.');
            updateAdminBtn();
            renderList();
        } else {
            const inputId = prompt("관리자 아이디를 입력하세요:");
            if (inputId === null) return;
            const inputPw = prompt("관리자 비밀번호를 입력하세요:");
            if (inputPw === null) return;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: inputId.trim(), password: inputPw.trim() })
                });

                if (res.ok) {
                    localStorage.setItem('isAdmin', 'true');
                    alert('관리자 로그인 성공!');
                    updateAdminBtn();
                    renderList();
                } else {
                    alert('아이디 또는 비밀번호가 올바르지 않습니다.');
                }
            } catch (err) {
                alert('서버 연결 실패');
            }
        }
    }

    // ⚙️ 관리자 계정 변경 함수
    async function changeAdminCredentials() {
        if (!checkAdmin()) return;

        const currentPassword = prompt("보안을 위해 현재 비밀번호를 입력하세요:");
        if (!currentPassword) return;

        const newId = prompt("새로운 관리자 아이디를 입력하세요:");
        if (!newId) return;

        const newPassword = prompt("새로운 관리자 비밀번호를 입력하세요:");
        if (!newPassword) return;

        try {
            const res = await fetch('/api/admin/change', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    currentPassword: currentPassword.trim(),
                    newId: newId.trim(),
                    newPassword: newPassword.trim()
                })
            });

            const data = await res.json();
            if (res.ok && data.success) {
                alert("관리자 계정 정보가 정상적으로 변경되었습니다!\n다시 로그인해 주세요.");
                localStorage.setItem('isAdmin', 'false');
                updateAdminBtn();
                renderList();
            } else {
                alert(data.message || "계정 변경에 실패했습니다.");
            }
        } catch (err) {
            alert("서버 연결 실패");
        }
    }

    // TMDB 인기 영화 목록 조회
    async function loadTMDB() {
        const grid = document.getElementById('tmdbGrid');
        try {
            const res = await fetch('/api/tmdb/popular');
            const data = await res.json();

            if (data.results && data.results.length > 0) {
                grid.innerHTML = data.results.slice(0, 10).map(m => `
                    <div class="tmdb-card" onclick="location.href='addForm.html?title=${encodeURIComponent(m.title)}'">
                        <img src="${m.poster_path ? 'https://image.tmdb.org/t/p/w200' + m.poster_path : 'https://via.placeholder.com/140x190'}" alt="${m.title}">
                        <div class="tmdb-card-body">${m.title}</div>
                    </div>
                `).join('');
            }
        } catch (err) {
            grid.innerHTML = `<div style="color:var(--text-sub); font-size:13px;">TMDB 목록 로드 실패</div>`;
        }
    }

    // 감상평 목록 불러오기
    async function fetchMovies() {
        try {
            const res = await fetch('/api/movies');
            if (res.ok) {
                allMovies = await res.json();
            } else {
                throw new Error();
            }
        } catch (err) {
            allMovies = JSON.parse(localStorage.getItem('myMovies') || '[]');
        }
        renderList();
    }

    // 필터 변경
    function setFilter(genre) {
        currentFilter = genre;
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.classList.toggle('active', btn.innerText === genre);
        });
        renderList();
    }

    // 게시글 리스트 렌더링
    function renderList() {
        const grid = document.getElementById('movieGrid');
        const searchText = document.getElementById('searchInput').value.toLowerCase().trim();
        const isAdmin = checkAdmin();

        let filtered = allMovies.filter(m => {
            const matchGenre = (currentFilter === '전체') || (m.genre === currentFilter);
            const matchSearch = m.title.toLowerCase().includes(searchText);
            const matchAdminHide = isAdmin ? true : !m.isHidden;
            return matchGenre && matchSearch && matchAdminHide;
        });

        if (filtered.length === 0) {
            grid.innerHTML = `<div class="empty-box">등록된 감상평이 없습니다. 첫 리뷰를 작성해보세요!</div>`;
            return;
        }

        grid.innerHTML = filtered.map(m => {
            const dateStr = m.createdAt ? new Date(m.createdAt).toLocaleDateString('ko-KR') : '2026. 08. 04';
            return `
                <div class="movie-card ${m.isHidden ? 'hidden-card' : ''}">
                    <div>
                        <div class="card-header">
                            <a href="detail.html?id=${m.id}" class="card-title">${m.title}</a>
                            <span class="genre-badge">${m.genre || '기타'}</span>
                        </div>
                        <div class="card-meta">✍️ ${m.writer || '익명'} | 📅 ${dateStr}</div>
                        <div class="card-content">${m.content || ''}</div>
                    </div>
                    <div class="card-footer">
                        <span>👁️ ${m.views || 0} | 👍 ${m.likes || 0}</span>
                        ${isAdmin ? `
                            <div class="card-actions">
                                <button class="action-btn" onclick="toggleHide('${m.id}')">${m.isHidden ? '👁️ 노출' : '🙈 숨김'}</button>
                                <button class="action-btn" style="color:var(--danger-color);" onclick="deleteMovie('${m.id}')">🗑️ 삭제</button>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }).join('');
    }

    // 게시글 숨김 토글 (관리자)
    async function toggleHide(id) {
        try {
            await fetch(`/api/movies/${id}/toggle-hide`, { method: 'POST' });
        } catch (err) {}
        fetchMovies();
    }

    // 게시글 개별 삭제 (관리자)
    async function deleteMovie(id) {
        if (!confirm("정말 이 감상평을 삭제하시겠습니까?")) return;
        try {
            await fetch(`/api/movies/${id}`, { method: 'DELETE' });
        } catch (err) {}
        fetchMovies();
    }

    // 게시글 전체 삭제 (관리자)
    async function deleteAllMovies() {
        if (!confirm("⚠️ 정말 모든 감상평을 삭제하시겠습니까?")) return;
        try {
            await fetch('/api/movies', { method: 'DELETE' });
        } catch (err) {}
        fetchMovies();
    }

    window.onload = () => {
        updateAdminBtn();
        loadTMDB();
        fetchMovies();
    };
</script>
</body>
</html>
