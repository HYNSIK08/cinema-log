server:
  port: ${PORT:8080}

spring:
  datasource:
    url: jdbc:h2:file:./data/cinemalog;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  thymeleaf:
    cache: false

app:
  admin:
    id: ${ADMIN_ID:hyunsik}
    password: ${ADMIN_PASSWORD:7356}

tmdb:
  api-key: ${TMDB_API_KEY:}
  base-url: https://api.themoviedb.org/3
