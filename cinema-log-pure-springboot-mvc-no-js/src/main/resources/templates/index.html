<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>시네마 로그</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body>
<nav class="nav"><div class="nav-links"><a th:href="@{/}"><b>🎬 시네마 로그</b></a><a th:href="@{/about}">소개</a><a th:href="@{/favorites}">⭐ 즐겨찾기</a><a th:href="@{/movies/new}">+ 감상평 등록</a></div><div><a th:unless="${admin}" class="btn secondary" th:href="@{/admin/login}">관리자 로그인</a><form th:if="${admin}" class="inline" th:action="@{/admin/logout}" method="post"><button class="secondary">로그아웃</button></form></div></nav>
<main class="container"><div th:if="${message}" class="flash" th:text="${message}"></div>
<section><h1>TMDB 영화 검색</h1><form class="toolbar" method="get" th:action="@{/}"><input style="max-width:480px" name="tmdbQuery" th:value="${tmdbQuery}" placeholder="영화 제목 검색"><button>검색</button><a class="btn secondary" th:href="@{/}">인기 영화</a></form><p class="error" th:if="${tmdbError}" th:text="${tmdbError}"></p><div class="grid"><article class="movie-card tmdb-card" th:each="tmdb : ${tmdbMovies}"><img class="poster" th:if="${tmdb['poster_path'] != null}" th:src="|https://image.tmdb.org/t/p/w500${tmdb['poster_path']}|" alt="포스터"><div class="poster" th:unless="${tmdb['poster_path'] != null}"></div><h3 th:text="${tmdb['title']}">영화</h3><p class="muted" th:text="${tmdb['release_date']}"></p><a class="btn" th:href="@{/movies/new(title=${tmdb['title']})}">이 영화 감상평 작성</a></article></div></section>
<section style="margin-top:42px"><h2>감상평 목록</h2><form class="filters" method="get" th:action="@{/}"><input name="search" th:value="${search}" placeholder="제목 검색"><select name="genre"><option value="">전체 장르</option><option th:selected="${genre=='액션'}">액션</option><option th:selected="${genre=='드라마'}">드라마</option><option th:selected="${genre=='코미디'}">코미디</option><option th:selected="${genre=='애니메이션'}">애니메이션</option><option th:selected="${genre=='공포'}">공포</option><option th:selected="${genre=='기타'}">기타</option></select><button>조회</button></form><div class="grid"><article class="movie-card" th:each="movie : ${movies}"><div class="hidden-badge" th:if="${movie.hidden}">관리자 숨김</div><h3><a th:href="@{/movies/{id}(id=${movie.id})}" th:text="${movie.title}"></a></h3><p class="muted" th:text="|${movie.genre ?: '기타'} · ${movie.writer ?: '익명'}|"></p><div class="meta"><span th:text="|조회 ${movie.views}|"></span><span th:text="|추천 ${movie.likes}|"></span></div><p class="content" th:text="${#strings.abbreviate(movie.content ?: '', 100)}"></p></article></div><p class="muted" th:if="${#lists.isEmpty(movies)}">등록된 감상평이 없습니다.</p><form th:if="${admin and !#lists.isEmpty(movies)}" method="post" th:action="@{/movies/delete-all}"><button class="danger">전체 삭제</button></form></section></main></body></html>
