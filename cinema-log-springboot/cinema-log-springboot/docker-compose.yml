services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: cinemalog
      MYSQL_ROOT_PASSWORD: 1234
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p1234"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: cinemalog
      MYSQL_USER: root
      MYSQL_PASSWORD: 1234
      ADMIN_ID: hyunsik
      ADMIN_PASSWORD: 7356
      TMDB_API_KEY: ${TMDB_API_KEY:-}
    ports:
      - "8080:8080"

volumes:
  mysql-data:
